<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>极简阅读器</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#f5f6f8; --panel:#fff; --text:#2c2f36; --muted:#7d8494;
    --accent:#4a6cf0; --border:#e4e7ee; --shadow:0 2px 12px rgba(0,0,0,.07);
    --notew:clamp(300px, 30vw, 400px);   /* 笔记面板宽度：小窗口也不会把正文挤没 */
  }
  html,body { height:100%; }
  body {
    font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    background:var(--bg); color:var(--text); overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }

  /* ===== 欢迎页 ===== */
  #welcome {
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; background:var(--bg); z-index:100; padding:24px;
  }
  #welcome.hide { display:none; }
  .logo-wrap { text-align:center; margin-bottom:26px; }
  .logo-wrap h1 { font-size:26px; font-weight:700; }
  .logo-wrap p { font-size:13px; color:var(--muted); margin-top:6px; }
  #dropzone {
    width:min(560px,92vw); padding:56px 40px; background:var(--panel);
    border:2px dashed #cdd3e2; border-radius:20px; text-align:center;
    cursor:pointer; transition:all .2s; box-shadow:var(--shadow);
  }
  #dropzone:hover { border-color:var(--accent); transform:translateY(-2px); }
  #dropzone.dragover { border-color:var(--accent); background:#f0f4ff; transform:scale(1.02); }
  .drop-icon { font-size:50px; margin-bottom:16px; }
  .drop-title { font-size:20px; font-weight:600; margin-bottom:9px; }
  .drop-sub { font-size:14px; color:var(--muted); line-height:1.7; }
  .drop-hint { margin-top:20px; font-size:12.5px; color:#a2a9ba; }

  /* 最近阅读：浏览器不允许自动重开上一本书，只能把书名和进度列出来，点了再选文件 */
  #recent { margin-top:24px; width:min(560px,92vw); }
  #recent:empty { display:none; }
  .recent-head {
    display:flex; align-items:center; gap:8px; padding:8px 6px; margin-bottom:2px;
    font-size:12px; color:var(--muted); letter-spacing:.5px; cursor:pointer; user-select:none;
  }
  .recent-head:hover { color:var(--accent); }
  .recent-arrow { flex:none; width:11px; font-size:9px; text-align:center; color:#9aa2b4; }
  .recent-head:hover .recent-arrow { color:var(--accent); }
  .recent-head-text { flex:1; min-width:0; }
  .recent-btns { flex:none; display:flex; align-items:center; gap:6px; letter-spacing:0; }
  .recent-btn {
    padding:4px 10px; border-radius:7px; font-size:11.5px; white-space:nowrap;
    color:var(--muted); background:#eff1f6; transition:all .15s; letter-spacing:0;
  }
  .recent-btn:hover:not(:disabled) { background:#e6ebf7; color:var(--accent); }
  .recent-btn:disabled { opacity:.45; cursor:not-allowed; }
  .recent-btn.confirm { background:#fff0f0; color:#c0392b; font-weight:600; }
  .recent-btn.danger.on { background:#fff0f0; color:#c0392b; font-weight:600; }
  /* 选择模式下每条左边的小方框 */
  .recent-pick {
    flex:none; width:17px; height:17px; border-radius:5px; border:1.5px solid #c9cfdd;
    background:#fff; color:#fff; font-size:11px; line-height:1;
    display:flex; align-items:center; justify-content:center; transition:all .15s;
  }
  .recent-item.picked { border-color:var(--accent); background:#f7f9ff; }
  .recent-item.picked .recent-pick { background:var(--accent); border-color:var(--accent); }
  .recent-item {
    display:flex; align-items:center; gap:10px; padding:11px 15px; background:var(--panel);
    border:1px solid var(--border); border-radius:11px; margin-bottom:8px; cursor:pointer;
    transition:all .15s;
  }
  .recent-item:hover { border-color:var(--accent); background:#f7f9ff; }
  /* 书名最多两行完整显示，不再nowrap截成"…"；超长书名悬停看全文 */
  .recent-title { flex:1; min-width:0; display:flex; align-items:flex-start; gap:5px; }
  .recent-name {
    flex:0 1 auto; min-width:0; font-size:13px; font-weight:600; line-height:1.45; word-break:break-word;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .recent-at { font-size:11.5px; color:var(--muted); flex-shrink:0; }
  /* 书名后面的格式后缀：跟着书名走，不参与截断，书名很长也看得见 */
  .recent-fmt {
    flex:none; margin-top:2px; font-size:10.5px; color:var(--muted); background:#eff1f6;
    border:1px solid var(--border); border-radius:5px; padding:1px 5px; letter-spacing:0;
  }

  /* ===== 阅读界面 ===== */
  #app { display:none; flex-direction:column; height:100vh; }
  #app.show { display:flex; }
  #toolbar {
    min-height:56px; background:var(--panel); border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:8px; padding:5px 14px; flex-shrink:0;
  }
  .tool-btn {
    width:36px; height:36px; border-radius:9px; display:flex; align-items:center;
    justify-content:center; font-size:16px; color:#5a6274; transition:all .15s;
  }
  .tool-btn:hover { background:#f0f2f7; color:var(--accent); }
  .tool-btn.active { background:#eaf0ff; color:var(--accent); }
  .tool-btn.has-note { color:var(--accent); }
  .book-info { flex:1; min-width:0; text-align:center; padding:0 8px; }
  /* 书名最多显示两行：长书名不再被截成"…"，鼠标悬停可看完整标题 */
  .book-title {
    font-size:14px; font-weight:600; line-height:1.3; word-break:break-word;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .book-author { font-size:11.5px; color:var(--muted); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  #main { flex:1; display:flex; min-height:0; position:relative; }
  #toc {
    width:270px; background:var(--panel); border-right:1px solid var(--border);
    overflow-y:auto; flex-shrink:0; transition:margin-left .22s ease;
  }
  #toc.collapsed { margin-left:-270px; }
  .toc-head {
    padding:14px 16px 10px; font-size:12px; font-weight:600; color:var(--muted);
    letter-spacing:1px; border-bottom:1px solid var(--border); position:sticky;
    top:0; background:var(--panel);
  }
  .toc-item {
    padding:8px 14px; font-size:13px; line-height:1.5; cursor:pointer;
    border-left:3px solid transparent; color:#4a5162; transition:background .12s, color .12s;
    display:flex; align-items:flex-start;
  }
  .toc-item:hover { background:#f5f7fb; color:var(--accent); }
  .toc-item.current { border-left-color:var(--accent); background:#f0f4ff; color:var(--accent); font-weight:600; }
  .toc-item .t { flex:1; min-width:0; word-break:break-word; }
  /* 树形目录：有子项的左边带一个三角，点三角折叠；子层级整体缩进并画一条导线 */
  .toc-item.parent > .t { font-weight:600; color:#39404f; }
  .toc-arrow {
    flex:none; width:13px; margin-right:5px; font-size:9px; line-height:1.9;
    color:#9aa2b4; text-align:center; user-select:none; cursor:pointer;
  }
  .toc-arrow:hover { color:var(--accent); }
  .toc-arrow.leaf { visibility:hidden; cursor:default; }
  .toc-item.closed + .toc-children { display:none; }
  .toc-children { margin-left:17px; border-left:1px dashed #dfe4ee; }
  /* 三四层的书（套装/合订本常见）缩进再收窄一点，不然窄栏里文字被挤成一条 */
  .toc-children .toc-children { margin-left:12px; }
  .toc-children .toc-children .toc-children { margin-left:10px; }
  /* 层次深时才出现的那条竖线也跟着变淡，避免整栏都是虚线 */
  .toc-children .toc-children { border-left-color:#e9edf5; }
  .toc-item.d1, .toc-item.d2 { padding:6px 12px; }
  .toc-item.d1 .t { font-size:12.5px; }
  .toc-item.d2 .t { font-size:12.5px; color:#565d6d; }
  .toc-item.d3, .toc-item.d4, .toc-item.d5 { padding:5px 12px; }
  .toc-item.d3 .t, .toc-item.d4 .t, .toc-item.d5 .t { font-size:12px; color:var(--muted); }
  .toc-empty { padding:14px 16px; font-size:12.5px; color:#a2a9ba; }
  /* 目录头部：右边挂一个"折叠全部 / 展开全部" */
  .toc-head { display:flex; align-items:center; gap:8px; }
  .toc-head > span:first-child { flex:1; min-width:0; }
  .toc-toggle-all {
    flex:none; padding:2px 8px; border-radius:6px; font-size:11px; font-weight:500;
    color:var(--accent); background:#eff2fb; cursor:pointer; letter-spacing:0; user-select:none;
  }
  .toc-toggle-all:hover { background:#e4ebfb; }

  #viewer-wrap { flex:1; min-width:0; background:#fafbfc; position:relative; }
  #viewer { width:100%; height:100%; border:none; display:block; background:#fff; }

  /* ===== 底部栏 ===== */
  #pager {
    height:44px; display:flex; align-items:center; justify-content:center; gap:18px;
    flex-shrink:0; border-top:1px solid var(--border); background:var(--panel);
    font-size:13px; color:var(--muted);
  }
  .page-btn { padding:6px 16px; border-radius:8px; font-size:13px; color:#5a6274; transition:all .15s; }
  .page-btn:hover:not(:disabled) { background:#eaf0ff; color:var(--accent); }
  .page-btn:disabled { opacity:.35; cursor:not-allowed; }
  #progress-text { min-width:110px; text-align:center; font-variant-numeric:tabular-nums; }

  /* ===== 设置面板 ===== */
  #settings {
    position:absolute; right:16px; top:12px; width:230px; background:var(--panel);
    border-radius:14px; box-shadow:0 8px 30px rgba(0,0,0,.14); padding:16px; z-index:50; display:none;
  }
  #settings.show { display:block; }
  .set-row { display:flex; align-items:center; justify-content:space-between; padding:9px 0; font-size:13px; }
  .set-label { color:#5a6274; font-size:12.5px; }
  .set-group { display:flex; gap:6px; flex-wrap:wrap; }
  .theme-dot { width:26px; height:26px; border-radius:50%; border:2px solid var(--border); transition:all .15s; cursor:pointer; }
  .theme-dot:hover { transform:scale(1.1); }
  .theme-dot.sel { border-color:var(--accent); box-shadow:0 0 0 2px #eaf0ff; }
  .fs-btn { width:30px; height:30px; border-radius:7px; background:#f0f2f7; font-size:14px;
            color:#5a6274; display:flex; align-items:center; justify-content:center; }
  .fs-btn:hover { background:#e2e8f5; }
  .w-btn { padding:5px 9px; border-radius:7px; background:#f0f2f7; font-size:11.5px;
           color:#5a6274; transition:all .15s; }
  .w-btn:hover { background:#e2e8f5; }
  .w-btn.sel { background:#eaf0ff; color:var(--accent); font-weight:600; }
  .btn-outline { width:100%; padding:9px; border-radius:9px; border:1px solid var(--border);
                 font-size:12.5px; color:#5a6274; margin-top:10px; transition:all .15s; }
  .btn-outline:hover { border-color:var(--accent); color:var(--accent); }

  /* ===== 状态提示（独立于 loading，避免被一起隐藏）===== */
  #loading {
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    flex-direction:column; gap:14px; background:rgba(245,246,248,.96); z-index:200;
  }
  #loading.show { display:flex; }
  .spinner { width:34px; height:34px; border:3px solid #dfe3ec; border-top-color:var(--accent);
             border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #loading-text { font-size:13.5px; color:var(--muted); }

  #toast {
    position:fixed; left:50%; transform:translateX(-50%); bottom:28px; z-index:300;
    max-width:min(560px,90vw); padding:13px 20px; border-radius:11px;
    background:#fff0f0; border:1px solid #f5c6c6; color:#c0392b;
    font-size:13px; line-height:1.6; box-shadow:0 6px 24px rgba(0,0,0,.12); display:none;
    white-space:pre-wrap;
  }
  #toast.show { display:block; }
  #toast.info { background:#eef4ff; border-color:#c9d8fb; color:#2a4bb8; }

  /* ===== 沉浸全屏：隐藏工具栏/目录/底栏，正文铺满整个视口 ===== */
  body.immersive #toolbar { display:none; }
  body.immersive #pager { display:none; }
  body.immersive #toc { display:none; }
  #fs-exit {
    position:fixed; right:18px; top:16px; z-index:400; display:none;
    padding:9px 15px; border-radius:10px; background:rgba(26,29,36,.55);
    color:#fff; font-size:12.5px; letter-spacing:.3px;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    transition:opacity .3s ease; opacity:1;
  }
  body.immersive #fs-exit { display:block; }
  #fs-exit.dim { opacity:0; pointer-events:none; }
  #fs-exit:hover { background:rgba(26,29,36,.8); }

  /* ===== 读书笔记 ===== */
  /* 全屏下工具栏被隐藏，用这个悬浮按钮保证随时能记笔记 */
  #note-fab {
    position:fixed; right:18px; top:64px; z-index:401; display:none;
    align-items:center; gap:6px; padding:9px 14px; border-radius:10px;
    background:rgba(26,29,36,.55); color:#fff; font-size:12.5px;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    transition:opacity .3s ease, background .15s;
  }
  body.immersive #note-fab { display:flex; }
  #note-fab.has-note { background:rgba(74,108,240,.75); }
  #note-fab:hover { background:rgba(26,29,36,.8); }
  #note-fab.has-note:hover { background:rgba(58,92,220,.9); }

  /* 笔记面板是 #main 里的第三列：把正文挤窄，而不是盖在正文上面 */
  #note-panel {
    flex:0 0 auto; width:0; overflow:hidden; background:var(--panel);
    border-left:0 solid transparent; display:flex; flex-direction:column;
    transition:width .22s ease;
  }
  #note-panel.show { width:var(--notew); border-left:1px solid var(--border); }
  /* 朗读保护：宽度一步到位，省掉过渡过程中连续几百毫秒的重排 */
  #note-panel.silent { transition:none; }
  /* 内容自己撑满固定宽度，面板收起时是被裁掉而不是被压扁 */
  #note-panel > .note-inner {
    width:var(--notew); height:100%; display:flex; flex-direction:column; flex-shrink:0;
  }
  .note-head-right { display:flex; align-items:center; gap:4px; flex-shrink:0; }
  .note-guard {
    padding:5px 8px; border-radius:7px; font-size:11px; color:var(--muted);
    background:#f0f2f7; white-space:nowrap; transition:all .15s;
  }
  .note-guard:hover { background:#e2e8f5; }
  .note-guard.on { background:#eaf0ff; color:var(--accent); font-weight:600; }
  .note-head {
    padding:14px 16px 12px; border-bottom:1px solid var(--border); flex-shrink:0;
  }
  .note-head-row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .note-title { font-size:14px; font-weight:600; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .note-close {
    width:28px; height:28px; border-radius:7px; display:flex; align-items:center;
    justify-content:center; font-size:15px; color:#5a6274; flex-shrink:0;
  }
  .note-close:hover { background:#f0f2f7; color:var(--accent); }
  .note-sub { font-size:11.5px; color:var(--muted); margin-top:5px; line-height:1.6; }
  .note-sub b { color:#5a6274; font-weight:600; }
  #note-text {
    flex:1; min-height:0; width:100%; border:none; outline:none; resize:none;
    padding:14px 16px; font-size:13.5px; line-height:1.8; color:var(--text);
    font-family:inherit; background:transparent;
  }
  .note-foot { border-top:1px solid var(--border); padding:12px 16px; flex-shrink:0; }
  .note-btns { display:flex; gap:8px; }
  .note-btn {
    flex:1; padding:9px 6px; border-radius:9px; background:#f0f2f7;
    font-size:12.5px; color:#5a6274; transition:all .15s;
  }
  .note-btn:hover { background:#e2e8f5; }
  .note-btn.primary { background:var(--accent); color:#fff; font-weight:600; }
  .note-btn.primary:hover { background:#3a5ce0; }
  .note-status { font-size:11.5px; color:var(--muted); margin-top:9px; min-height:16px; line-height:1.5; white-space:pre-line; word-break:break-all; }
  .note-status.warn { color:#c0392b; }
  .note-status.ok { color:#1d8a4e; }   /* 保存成功的轻提示：一行小绿字，两三秒自动消失 */
  .note-dirrow {
    display:flex; align-items:flex-start; justify-content:space-between; gap:8px;
    margin-top:9px; font-size:11.5px; color:var(--muted);
  }
  /* 路径可能很长，允许整段换行，别把「更改…」按钮挤掉 */
  #note-dir-text { word-break:break-all; line-height:1.5; min-width:0; }
  .note-dirrow button { font-size:11.5px; color:var(--accent); text-decoration:underline; flex-shrink:0; white-space:nowrap; }
  .note-dirrow button:hover { color:#3a5ce0; }
  .note-dirbtns { display:flex; gap:10px; flex-shrink:0; }
</style>
</head>
<body>

<div id="welcome">
  <div class="logo-wrap">
    <h1>极简阅读器</h1>
    <p>零依赖 · 完全离线 · 双击即用　·　v1.2</p>
  </div>
  <div id="dropzone">
    <div class="drop-icon">📖</div>
    <div class="drop-title">拖入电子书</div>
    <div class="drop-sub">或者点击此处从电脑中选择<br>支持 .epub / .mobi / .azw3 / .pdf / .txt</div>
    <div class="drop-hint">快捷键：← → 翻页 &nbsp;·&nbsp; T 目录 &nbsp;·&nbsp; N 笔记 &nbsp;·&nbsp; F 沉浸全屏</div>
  </div>
  <input type="file" id="file-input" accept=".epub,.mobi,.azw,.azw3,.pdb,.pdf,.txt,.text" hidden>
  <div id="recent"></div>
</div>

<div id="app">
  <div id="toolbar">
    <button class="tool-btn" id="btn-toc" title="目录 (T)">☰</button>
    <button class="tool-btn" id="btn-new" title="打开其他书">📂</button>
    <div class="book-info">
      <div class="book-title" id="meta-title">—</div>
      <div class="book-author" id="meta-author"></div>
    </div>
    <button class="tool-btn" id="btn-note" title="读书笔记 (N)">✎</button>
    <button class="tool-btn" id="btn-settings" title="阅读设置">⚙️</button>
    <button class="tool-btn" id="btn-full" title="沉浸全屏 (F)">⛶</button>
  </div>
  <div id="main">
    <div id="toc">
      <div class="toc-head">
        <span id="toc-head">目录</span>
        <span class="toc-toggle-all" id="toc-toggle-all" title="一键折叠 / 展开所有层级">折叠全部</span>
      </div>
      <div id="toc-list"></div>
    </div>
    <div id="viewer-wrap">
      <iframe id="viewer" title="阅读区"></iframe>
      <div id="settings">
        <div class="set-row">
          <span class="set-label">字体大小</span>
          <div class="set-group">
            <button class="fs-btn" id="fs-minus">A-</button>
            <button class="fs-btn" id="fs-plus">A+</button>
          </div>
        </div>
        <div class="set-row">
          <span class="set-label">主题</span>
          <div class="set-group">
            <div class="theme-dot sel" data-theme="light" style="background:#fff"></div>
            <div class="theme-dot" data-theme="sepia" style="background:#f4ecd8"></div>
            <div class="theme-dot" data-theme="dark" style="background:#22252b"></div>
          </div>
        </div>
        <div class="set-row">
          <span class="set-label">版心宽度</span>
          <div class="set-group">
            <button class="w-btn" data-w="680">窄</button>
            <button class="w-btn sel" data-w="760">标准</button>
            <button class="w-btn" data-w="0">铺满</button>
          </div>
        </div>
        <div class="set-row" id="row-startdir">
          <span class="set-label">选择框起始位置</span>
          <div class="set-group">
            <button class="w-btn dirbtn sel" data-dir="" title="让浏览器记住上次选书时所在的文件夹">上次位置</button>
            <button class="w-btn dirbtn" data-dir="downloads">下载</button>
            <button class="w-btn dirbtn" data-dir="desktop">桌面</button>
            <button class="w-btn dirbtn" data-dir="documents">文档</button>
            <button class="w-btn dirbtn" data-act="custom" title="指定一个文件夹，以后点「拖入电子书」都从这里开始">书库…</button>
          </div>
        </div>
        <button class="btn-outline" id="btn-reset">清除本书阅读进度</button>

    <!-- 笔记面板：挤占正文空间，不浮在上面挡字 -->
    <div id="note-panel">
      <div class="note-inner">
        <div class="note-head">

            <div class="note-title" id="note-title">读书笔记</div>
            <div class="note-head-right">
              <button class="note-guard" id="note-guard" title="浏览器朗读时打开：面板不抢焦点、不跟着朗读滚动刷新，写笔记不影响朗读">🔊 朗读保护</button>
              <button class="note-close" id="note-close" title="关闭 (Esc)">✕</button>

        <textarea id="note-text" spellcheck="false" autocorrect="off" autocapitalize="off"
          placeholder="在这里写下你的想法…&#10;&#10;内容会自动暂存，点“保存到文件”会导出成一个以书名命名的文件。"></textarea>
        <div class="note-foot">
          <div class="note-btns">
            <button class="note-btn primary" id="note-save">保存到文件</button>
            <button class="note-btn" id="note-import-btn">读入</button>
            <button class="note-btn" id="note-clear">清空</button>
          </div>
          <div class="note-dirrow">
            <span id="note-dir-text">保存位置：浏览器下载目录</span>
            <span class="note-dirbtns">
              <button id="note-path-btn" style="display:none" title="浏览器不给网页完整路径，手工标注一次，之后“保存位置”就按你写的显示">标注路径…</button>
              <button id="note-dir-btn">更改…</button>
              <button id="note-dir-clear" style="display:none">恢复默认</button>
            </span>

  </div>
  <div id="pager">
    <button class="page-btn" id="btn-prev">← 上一章</button>
    <span id="progress-text">—</span>
    <button class="page-btn" id="btn-next">下一章 →</button>

  <div class="spinner"></div>
  <div id="loading-text">正在解析电子书…</div>

<input type="file" id="note-import" accept=".md,.txt,.markdown" hidden>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var welcome = $('welcome'), dropzone = $('dropzone'), fileInput = $('file-input');
  var app = $('app'), viewer = $('viewer'), loading = $('loading');
  var loadingText = $('loading-text'), toast = $('toast');

  var state = {
    buf: null, zip: null, chapters: [], toc: [], colWidth: 760,
    fileName: '', bookTitle: '', bookAuthor: '', chapterIndex: 0, fontSize: 19, theme: 'light',
    currentChapter: 0, currentFrag: '', currentLabel: '', ready: false, kind: ''
  };

  var THEMES = {
    light: { bg: '#ffffff', color: '#2c2f36' },
    sepia: { bg: '#f4ecd8', color: '#4b3f2f' },
    dark:  { bg: '#22252b', color: '#c9ced8' }
  };

  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };

  var toastTimer = null;
  function showToast(msg, isInfo) {
    toast.textContent = msg;
    toast.className = isInfo ? 'info show' : 'show';
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.className = ''; }, isInfo ? 4000 : 9000);
  }
  function showLoading(t) { loadingText.textContent = t; loading.classList.add('show'); }
  function hideLoading() { loading.classList.remove('show'); }

  /* ================= ZIP 解析（不依赖任何库） ================= */

  function findEOCD(dv, len) {
    var min = Math.max(0, len - 65558);
    for (var i = len - 22; i >= min; i--) {
      if (dv.getUint32(i, true) === 0x06054b50) return i;
    }
    return -1;
  }

  function parseZip(buf) {
    var dv = new DataView(buf);
    var eocd = findEOCD(dv, buf.byteLength);
    if (eocd < 0) throw new Error('这不是有效的 EPUB/ZIP 文件');

    var count = dv.getUint16(eocd + 10, true);
    var cdOffset = dv.getUint32(eocd + 16, true);
    var files = {};
    var p = cdOffset;
    var dec = new TextDecoder('utf-8');

    for (var n = 0; n < count; n++) {
      if (p + 46 > buf.byteLength) break;
      if (dv.getUint32(p, true) !== 0x02014b50) break;
      var method = dv.getUint16(p + 10, true);
      var compSize = dv.getUint32(p + 20, true);
      var nameLen = dv.getUint16(p + 28, true);
      var extraLen = dv.getUint16(p + 30, true);
      var commentLen = dv.getUint16(p + 32, true);
      var lfhOffset = dv.getUint32(p + 42, true);
      var name = dec.decode(new Uint8Array(buf, p + 46, nameLen));
      files[name] = { method: method, compSize: compSize, lfhOffset: lfhOffset };
      p += 46 + nameLen + extraLen + commentLen;
    }
    return files;
  }

  async function decompress(bytes, method) {
    if (method === 0) return bytes;             // stored
    if (method !== 8) throw new Error('不支持的压缩方式: ' + method);
    var ds;
    try { ds = new DecompressionStream('deflate-raw'); }
    catch (e) { ds = new DecompressionStream('deflate'); }
    var stream = new Blob([bytes]).stream().pipeThrough(ds);
    var out = await new Response(stream).arrayBuffer();
    return new Uint8Array(out);
  }

  async function readEntryRaw(buf, entry) {
    var dv = new DataView(buf);
    var p = entry.lfhOffset;
    var nameLen = dv.getUint16(p + 26, true);
    var extraLen = dv.getUint16(p + 28, true);
    var start = p + 30 + nameLen + extraLen;
    var chunk = new Uint8Array(buf, start, entry.compSize);
    return await decompress(chunk, entry.method);
  }

  function findEntry(zip, path) {
    if (!zip) return null;
    if (zip[path]) return zip[path];
    var keys = Object.keys(zip);
    for (var i = 0; i < keys.length; i++) {
      if (keys[i].toLowerCase() === path.toLowerCase()) return zip[keys[i]];
    }
    return null;
  }

  async function readText(buf, zip, path) {
    var e = findEntry(zip, path);
    if (!e) throw new Error('压缩包内找不到: ' + path);
    var bytes = await readEntryRaw(buf, e);
    return new TextDecoder('utf-8').decode(bytes);
  }

  /* ================= 路径与 XML 辅助 ================= */

  function resolvePath(base, rel) {
    if (!rel) return null;
    if (/^(https?:|mailto:|data:|#)/i.test(rel)) return null;
    var frag = '';
    var hi = rel.indexOf('#');
    if (hi >= 0) { frag = rel.slice(hi); rel = rel.slice(0, hi); }
    try { rel = decodeURIComponent(rel); } catch (e) {}
    var parts = (base ? base.split('/') : []).concat(rel.split('/'));
    var out = [];
    for (var i = 0; i < parts.length; i++) {
      var seg = parts[i];
      if (seg === '' || seg === '.') continue;
      if (seg === '..') out.pop();
      else out.push(seg);
    }
    return { path: out.join('/'), frag: frag };
  }

  function dirname(p) {
    var i = p.lastIndexOf('/');
    return i >= 0 ? p.slice(0, i) : '';
  }

  function parseXML(text) {
    var doc = new DOMParser().parseFromString(text, 'application/xml');
    var err = doc.getElementsByTagName('parsererror');
    if (err && err.length) throw new Error('XML 解析失败');
    return doc;
  }

  /* ================= EPUB 解析 ================= */

  async function loadEpub(file) {
    var buf = await file.arrayBuffer();
    var zip = parseZip(buf);

    var container = await readText(buf, zip, 'META-INF/container.xml');
    var cdoc = parseXML(container);
    var roots = cdoc.getElementsByTagName('rootfile');
    if (!roots.length) throw new Error('container.xml 中没有 rootfile');
    var opfPath = roots[0].getAttribute('full-path');
    if (!opfPath) throw new Error('无法定位 OPF 文件');

    var base = dirname(opfPath);
    var opfText = await readText(buf, zip, opfPath);
    var odoc = parseXML(opfText);

    // manifest
    var manifest = {};
    var items = odoc.getElementsByTagName('item');
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var id = it.getAttribute('id');
      var href = it.getAttribute('href');
      if (!id || !href) continue;
      var r = resolvePath(base, href);
      manifest[id] = {
        id: id,
        href: href,
        path: r ? r.path : null,
        type: it.getAttribute('media-type') || '',
        props: it.getAttribute('properties') || ''
      };
    }

    // spine
    var spineIds = [];
    var spineEl = odoc.getElementsByTagName('spine')[0];
    var navId = spineEl ? spineEl.getAttribute('toc') : null;
    var irefs = odoc.getElementsByTagName('itemref');
    for (var j = 0; j < irefs.length; j++) {
      var idref = irefs[j].getAttribute('idref');
      if (idref) spineIds.push(idref);
    }

    // metadata
    var meta = { title: '', creator: '' };
    var ns = 'http://purl.org/dc/elements/1.1/';
    var t = odoc.getElementsByTagNameNS(ns, 'title');
    if (t.length) meta.title = t[0].textContent.trim();
    var c = odoc.getElementsByTagNameNS(ns, 'creator');
    if (c.length) meta.creator = c[0].textContent.trim();

    // 章节：spine 顺序，跳过 nav 文档
    var chapters = [];
    for (var k = 0; k < spineIds.length; k++) {
      var m = manifest[spineIds[k]];
      if (!m || !m.path) continue;
      if (m.props && m.props.indexOf('nav') >= 0) continue;
      chapters.push(m);
    }
    if (!chapters.length) throw new Error('这本书没有任何可读章节');

    var toc = await buildTOC(buf, zip, manifest, chapters, navId, base);

    return {
      buf: buf, zip: zip, base: base, manifest: manifest,
      chapters: chapters, toc: toc || [], meta: meta,
      debug: {
        format: 'EPUB',
        spine: chapters.length,
        tocSource: (toc && toc.src) || 'none',
        tocItems: toc ? toc.length : 0
      }
    };
  }

  function cleanLabel(s) {
    return (s || '').replace(/\s+/g, ' ').trim();
  }

  // 章节匹配：先按完整路径，再按文件名兜底（很多书的目录 href 和 spine 路径写法不一致）
  // 返回命中的章节序号和锚点（href 里 # 后面的部分，用来定位章内具体位置——
  // 不少书把几章塞进同一个 XHTML，目录全靠锚点区分，丢了锚点就会点哪都跳到同一处）
  function matchChapter(path, chapters, base) {
    if (!path) return null;
    var r = resolvePath(base || '', path);
    var tp = r ? r.path : path;
    var frag = (r && r.frag) || '';
    tp = tp.replace(/^[\s\uFEFF]+/, '');
    var bare = tp.split('/').pop();
    var i;
    for (i = 0; i < chapters.length; i++) {
      if (chapters[i].path === tp) return { index: i, frag: frag };
    }
    if (bare) {
      for (i = 0; i < chapters.length; i++) {
        var cb = (chapters[i].path || '').split('/').pop();
        if (cb && cb === bare) return { index: i, frag: frag };
      }
    }
    return null;
  }

  function matchChapterIndex(path, chapters, base) {
    var m = matchChapter(path, chapters, base);
    return m ? m.index : -1;
  }

  function looksLikeNavFile(p) {
    var n = (p || '').toLowerCase().split('/').pop();
    return n === 'nav.xhtml' || n === 'nav.xht' || n === 'nav.html' ||
           n === 'toc.xhtml' || n === 'toc.xht' || n === 'toc.html' ||
           /\.ncx$/.test(n);
  }

  /* 目录够不够用：不少书的 NCX 里只写了一条「开始」或两三行，用它等于没目录。
     这种情况宁可退回「按每章标题自造一份」，也比只有一项强。 */
  function tocGoodEnough(toc, chapters) {
    if (!toc || !toc.length) return false;
    var c = chapters ? chapters.length : 0;
    if (c <= 3) return true;                                    // 本来就没几章，一条也算数
    if (toc.length < 3) return false;
    if (c >= 12 && toc.length < Math.ceil(c / 4)) return false;  // 覆盖的章节太少
    return true;
  }

  async function buildTOC(buf, zip, manifest, chapters, navId, base) {
    var toc = null, best = null, bestSrc = '';

    // 收一个候选：够用就直接采用；不够用先留着，实在没别的再退而用它
    function take(list, src) {
      if (!list || !list.length) return false;
      if (!best) { best = list; bestSrc = src; }
      if (tocGoodEnough(list, chapters)) { best = list; bestSrc = src; return true; }
      return false;
    }

    // 1) EPUB3：manifest 中 properties 含 nav 的导航文档
    for (var id in manifest) {
      var m = manifest[id];
      if (m.props && m.props.indexOf('nav') >= 0 && m.path) {
        try {
          toc = parseNavXHTML(await readText(buf, zip, m.path), m.path, chapters);
        } catch (e) { toc = null; }
        if (take(toc, 'nav')) return markTOC(best, bestSrc);
      }
    }

    // 2) spine 的 toc 属性（EPUB2 指向 .ncx，也可能指向 xhtml）
    if (navId && manifest[navId] && manifest[navId].path) {
      var np = manifest[navId].path;
      try {
        var ntxt = await readText(buf, zip, np);
        toc = /\.ncx$/i.test(np) ? parseNCXAny(ntxt, np, chapters) : parseNavXHTML(ntxt, np, chapters);
      } catch (e) { toc = null; }
      if (take(toc, /\.ncx$/i.test(np) ? 'ncx' : 'nav')) return markTOC(best, bestSrc);
    }

    // 3) 按文件名猜：nav.xhtml / toc.ncx / 任何 .ncx
    var keys = Object.keys(manifest);
    var triedPath = (navId && manifest[navId]) ? manifest[navId].path : '';
    for (var i = 0; i < keys.length; i++) {
      var mm = manifest[keys[i]];
      if (!mm.path || !looksLikeNavFile(mm.path)) continue;
      if (mm.path === triedPath) continue;                 // 第 2 步已经读过了，别重复解析
      try {
        var txt = await readText(buf, zip, mm.path);
        toc = /\.ncx$/i.test(mm.path) ? parseNCXAny(txt, mm.path, chapters) : parseNavXHTML(txt, mm.path, chapters);
      } catch (e) { toc = null; }
      if (take(toc, /\.ncx$/i.test(mm.path) ? 'ncx' : 'nav')) return markTOC(best, bestSrc);
    }

    // 4) 都不够用：读取每一章的标题自己造目录，条目数比残缺的 NCX 多就用它
    var gen = await buildTOCFromChapters(buf, zip, chapters);
    if (gen && gen.length) {
      if (best && best.length >= gen.length) return markTOC(best, bestSrc);
      return markTOC(gen, 'chapters');
    }
    return markTOC(best || [], bestSrc || 'none');
  }

  /* 目录层级归一化：
     - 有的书第一层就写成 level=1，整体减掉最小值，免得整棵树多缩进一级；
     - 有的书少写一层（0 → 2），隔级下钻会让后面的条目全挤到一个不存在的父节点下，
       这里限制每次最多只比上一条深一级。 */
  function normalizeTOCLevels(list) {
    if (!list || !list.length) return list;
    var min = 99, i, lv;
    for (i = 0; i < list.length; i++) {
      lv = list[i].level || 0;
      if (lv < min) min = lv;
    }
    var prev = 0;
    for (i = 0; i < list.length; i++) {
      lv = (list[i].level || 0) - min;
      if (lv < 0) lv = 0;
      if (lv > prev + 1) lv = prev + 1;
      if (lv > 5) lv = 5;
      list[i].level = lv;
      prev = lv;
    }
    return list;
  }

  // 给目录挂个来源标记，诊断用（Ctrl+Alt+D 可见）
  function markTOC(toc, src) {
    toc = normalizeTOCLevels(toc || []);
    toc.src = src;
    return toc;
  }

  // 正文里第一行「像标题」的文字：短、不带句读，容器节点（整章 textContent）直接跳过
  function firstLine(doc) {
    if (!doc || !doc.body) return '';
    var nodes = doc.body.querySelectorAll('p, div, h4, h5, h6, span');
    for (var i = 0; i < nodes.length && i < 30; i++) {
      var t = cleanLabel(nodes[i].textContent);
      if (!t || t.length > 60) continue;          // 空行 / 整段容器，跳过
      if (/[。！？；]/.test(t)) continue;           // 带句号的是正文，不是标题
      return t;
    }
    return '';
  }

  async function buildTOCFromChapters(buf, zip, chapters) {
    var out = [], alts = [], i;
    for (i = 0; i < chapters.length; i++) {
      var label = '', alt = '';
      try {
        var html = await readText(buf, zip, chapters[i].path);
        var d = new DOMParser().parseFromString(html, 'text/html');
        var h = d.querySelector('h1') || d.querySelector('h2') || d.querySelector('h3');
        if (h) label = cleanLabel(h.textContent);
        alt = firstLine(d);
        if (!label) label = alt;                   // 没有标题元素就用正文首行
      } catch (e) {}
      out.push({ label: (label || ('第 ' + (i + 1) + ' 节')).slice(0, 60), index: i, level: 0 });
      alts.push(alt);
    }

    // 一堆文件共用同一个标题（Calibre 切出来的书，<title> 全是书名）：
    // 这些重复的行改用正文首行，还是重名就退回章节序号，免得整列都是同一个词
    var freq = {}, dupLimit = Math.max(2, Math.ceil(out.length / 2));
    for (i = 0; i < out.length; i++) freq[out[i].label] = (freq[out[i].label] || 0) + 1;
    for (i = 0; i < out.length; i++) {
      if ((freq[out[i].label] || 0) < dupLimit) continue;
      var a = (alts[i] || '').slice(0, 60);
      out[i].label = (a && a !== out[i].label) ? a : ('第 ' + (i + 1) + ' 节');
    }
    return out;
  }

  function dedupTOC(list) {
    var seen = {}, out = [];
    for (var i = 0; i < list.length; i++) {
      var key = list[i].index + '|' + list[i].label + '|' + (list[i].frag || '');
      if (seen[key]) continue;
      seen[key] = 1;
      out.push(list[i]);
    }
    return out;
  }

  function parseNavXHTML(text, navPath, chapters) {
    var doc = new DOMParser().parseFromString(text, 'text/html');
    var navBase = dirname(navPath);
    var out = [];
    var navs = doc.getElementsByTagName('nav');
    var target = null;
    var i, t;
    for (i = 0; i < navs.length; i++) {
      t = navs[i].getAttribute('epub:type') ||
          navs[i].getAttributeNS('http://www.idpf.org/2007/ops', 'type') ||
          navs[i].getAttribute('type');
      if (t && t.toLowerCase().indexOf('toc') >= 0) { target = navs[i]; break; }
    }
    if (!target) {
      for (i = 0; i < navs.length; i++) {
        if (navs[i].getElementsByTagName('a').length) { target = navs[i]; break; }
      }
    }
    if (!target) {
      // 连 <nav> 都没有：把整篇文档里的内部链接当目录
      target = doc.body || doc;
    }

    var lis = target.getElementsByTagName('li');
    var links = lis.length ? null : target.getElementsByTagName('a');
    if (links) {
      for (i = 0; i < links.length; i++) {
        pushNav(links[i], links[i], 0);
      }
    } else {
      for (i = 0; i < lis.length; i++) {
        var a = lis[i].getElementsByTagName('a')[0];
        if (!a) continue;
        var depth = 0, p = lis[i].parentNode;
        while (p && p !== target) {
          if (p.tagName === 'LI') depth++;
          p = p.parentNode;
        }
        pushNav(a, lis[i], depth);
      }
    }

    function pushNav(a, li, depth) {
      var href = a.getAttribute('href');
      if (!href) return;
      var m = matchChapter(href, chapters, navBase);
      if (!m) return;
      var label = cleanLabel(a.getAttribute('title') || a.textContent);
      out.push({
        label: label || ('第 ' + (m.index + 1) + ' 节'),
        index: m.index,
        level: Math.min(depth || 0, 5),
        frag: m.frag || ''
      });
    }

    return dedupTOC(out);
  }

  function parseNCX(text, ncxPath, chapters) {
    var doc = parseXML(text);
    var ncxBase = dirname(ncxPath);
    var points = doc.getElementsByTagName('navPoint');
    var out = [];
    for (var i = 0; i < points.length; i++) {
      var content = points[i].getElementsByTagName('content');
      if (!content.length) continue;
      var mm = matchChapter(content[0].getAttribute('src'), chapters, ncxBase);
      if (!mm) continue;
      var labelEl = points[i].getElementsByTagName('text');
      var label = labelEl.length ? cleanLabel(labelEl[0].textContent) : '';
      var level = 0, p = points[i].parentNode;
      while (p) {
        var nm = p.nodeName || '';
        if (nm === 'navPoint' || nm.split(':').pop() === 'navPoint') level++;
        p = p.parentNode;
      }
      out.push({
        label: label || ('第 ' + (mm.index + 1) + ' 节'),
        index: mm.index,
        level: Math.min(level, 5),
        frag: mm.frag || ''
      });
    }
    return dedupTOC(out);
  }

  // 正则版 NCX 解析（首选）：不走 DOMParser 的 XML 严格模式。
  // 有些书的 NCX 带 DOCTYPE / 命名空间 / 实体，XML 解析会报错或弄丢层级，
  // 这里直接按标签流扫：navPoint 开闭配对算深度，text 取标题，content 取目标。
  // 已用真实书目验证：条目和层级都能完整还原。
  function parseNCXRegex(text, ncxPath, chapters) {

  /* ================= MOBI / KF8（Palm 数据库） ================= */
  /* 参考 foliate-js 的实现；KF7(KF7=MOBI6) 完整支持，KF8 走 FDST 切分 */

      idxt: be32(r, 20),

  // Huffdic（compression = 17480）

      var len = be32(r, 4);

        encryption: be16(rec0, 12)

        length: be32(rec0, 20),
        encoding: be32(rec0, 28),
        version: be32(rec0, 36),
        titleOffset: be32(rec0, 84),
        titleLength: be32(rec0, 88),
        resourceStart: be32(rec0, 108),

      else if (type === 503) out.title = decodeBytes(rec0.subarray(p + 8, p + len), enc);
      else if (type === 100) out.creator = decodeBytes(rec0.subarray(p + 8, p + len), enc);

  async function loadMobi(file) {

    if (h.palmdoc.encryption !== 0) throw new Error('这本 MOBI 有加密 / DRM，无法读取');

    var exth = (h.mobi.exthFlag & 0x40) ? parseEXTH(rec(0), h.mobi.length + 16, enc) : {};

    else if (comp === 17480) decompress = buildHuffDecompressor(h, recB);
    else throw new Error('不支持的 MOBI 压缩方式：' + comp);

    var ncxCache = null, ncxDone = false;

        var p6 = (tm[6] && tm[6].length) ? tm[6] : null;
        items.push({
          label: cleanLabel(lab).slice(0, 80),
          level: tm[4] ? (tm[4][0] || 0) : 0,
          pos: isKF8 ? (p6 || p1) : (p1 || p6)
        });
      }
      // 条目特别多时截一刀，避免后面的比对把打开速度拖垮

    var resCache = {};
    function getResURI(idx) {
      if (idx < 0) return null;

    /* ---- KF8 的 SKEL/FRAG：这才是"章节"的划分 ----
       FDST 里的 flow 只给资源加载用（kindle:flow），拿它当章节号对 NCX 是错的：

        if (magicOf(recB(skelIdx), 0) !== 'INDX' || magicOf(recB(fragIdx), 0) !== 'INDX') return null;

        var skData = readIndexEntries(skelIdx), frData = readIndexEntries(fragIdx);

            length: (tm[6] && tm[6].length > 1) ? tm[6][1] : 0,
            offset: (tm[6] && tm[6].length) ? tm[6][0] : 0

          tm = frData.table[i].tagMap;
          frags.push({
            index: (tm[4] && tm[4].length) ? tm[4][0] : -1,   // 这就是 NCX 里的 fid
            length: (tm[6] && tm[6].length > 1) ? tm[6][1] : 0

        if (!skels.length) return null;

        // 正文里骨架和它的碎片是连续存放的，所以章节就是一段段顺序的字节范围

        for (i = 0; i < skels.length; i++) {
          var nF = Math.max(0, Math.min(skels[i].numFrag, frags.length - fragStart));
          var len = skels[i].length;
          for (j = 0; j < nF; j++) {
            var fg = frags[fragStart + j];
            len += fg.length;

          }
          fragStart += nF;
          secs.push({ start: start, end: start + len });
          start += len;

        for (i = 0; i <= hi; i++) {
          var o = i * bn;
          if (bn === 1) { pal[i * 3] = lb[o]; pal[i * 3 + 1] = lb[o]; pal[i * 3 + 2] = lb[o]; }
          else if (bn === 4) {
            pal[i * 3] = 255 - Math.min(255, lb[o] + lb[o + 3]);
            pal[i * 3 + 1] = 255 - Math.min(255, lb[o + 1] + lb[o + 3]);
            pal[i * 3 + 2] = 255 - Math.min(255, lb[o + 2] + lb[o + 3]);
          } else { pal[i * 3] = lb[o]; pal[i * 3 + 1] = lb[o + 1]; pal[i * 3 + 2] = lb[o + 2]; }

          rgb[q2 + 1] = 255 - Math.min(255, data[p2 + 1] + data[p2 + 3]);

    /* ---------- 资源预解析（字体 / XObject，都是异步解码，先备好） ---------- */
    async function prepRes(rd, depth) {

          if (xnum === null || xobjPrep[xnum] !== undefined) continue;
          d = res(xe);
          sub = nameOf(dget(d, 'Subtype'));
          raw2 = getRaw(xnum);
          xobjPrep[xnum] = null;
          if (sub === 'Image') {
            imgData = (raw2 && raw2.stream) ? await decodeStream(d, raw2.stream) : null;

          } else if (sub === 'Form') {
            fdata = (raw2 && raw2.stream) ? await decodeStream(d, raw2.stream) : null;
            subRes = res(dget(d, 'Resources')) || null;
            xobjPrep[xnum] = { type: 'form', dict: d, res: subRes, toks: fdata ? tokenizeContent(fdata) : [] };

    /* ---------- 内容流 ---------- */
    function tokenizeContent(bytes) {

        r = pdfVal(bytes, p);
        if (!r[0] || r[1] === p) break;
        p = r[1];
        if (r[0].t === 'kw' && r[0].v === 'BI') {
          q = p;
          var found = false;
          while (q < bytes.length) {
            r2 = pdfVal(bytes, q);
            if (!r2[0] || r2[1] === q) break;
            q = r2[1];
            if (r2[0].t === 'kw' && r2[0].v === 'ID') { found = true; break; }
          }
          if (!found) break;
          q = pSkip(bytes, q);
          if (bytes[q] === 13) q++;
          if (bytes[q] === 10) q++;
          ie = findBytes(bytes, 'EI', q);
          p = ie >= 0 ? ie + 2 : bytes.length;

        out.push(r[0]);

    function runTokens(toks, resDict, baseCtm, items, depth) {
      if (depth > 8 || !toks || !toks.length) return;
      var ctm = baseCtm.slice(), stack = [];
      var tm = [1, 0, 0, 1, 0, 0], tlm = [1, 0, 0, 1, 0, 0];
      var tfs = 12, th = 1, rise = 0, tc = 0, tw = 0, tl = 0, font = null;
      var args = [], i, t, op, a2, arr, k2, el, adj;
      var rdFonts = (resDict && resDict.__fonts) || null;

      function N(k) { var a = args[k]; return (a && a.t === 'num') ? a.v : 0; }
      function S(k) { var a = args[k]; return (a && a.t === 'str') ? a.v : ''; }
      function pushSt() { stack.push([ctm.slice(), tm.slice(), tlm.slice(), tfs, th, rise, tc, tw, tl, font]); }
      function popSt() {
        var s = stack.pop();
        if (!s) return;
        ctm = s[0]; tm = s[1]; tlm = s[2]; tfs = s[3]; th = s[4];
        rise = s[5]; tc = s[6]; tw = s[7]; tl = s[8]; font = s[9];
      }
      function show(s) {
        if (!s) return;
        var txt = font ? font.decode(s) : s;
        txt = txt.replace(/\u0000/g, '');
        if (!txt.replace(/\s/g, '')) return;
        // 规范：Trm = [Tfs*Th 0 0 / 0 Tfs 0 / 0 rise 1] × Tm × CTM
        var trm = mmul(mmul([tfs * th, 0, 0, tfs, 0, rise], tm), ctm);
        items.push({
          t: 'txt', x: trm[4], y: trm[5],
          s: Math.sqrt(trm[0] * trm[0] + trm[1] * trm[1]) || tfs,
          str: txt
        });
        var sp = 0;
        for (var si = 0; si < s.length; si++) if (s.charCodeAt(si) === 32) sp++;
        tm = tmAdvance(tm, (estEm(txt) * tfs + tc * txt.length + tw * sp) * th, 0);
      }
      function doXObj(tok) {
        if (!tok || tok.t !== 'name') return;
        var xd = dget(res(resDict), 'XObject');
        if (!xd || xd.t !== 'dict') return;
        var entry = xd.v[tok.v];
        if (!entry) return;
        var num = (entry.t === 'ref') ? entry.v : null;
        var prep = (num !== null) ? xobjPrep[num] : null;
        if (!prep) return;
        if (prep.type === 'image') {
          if (prep.uri) items.push({ t: 'img', y: ctm[5] + Math.abs(ctm[3]), x: ctm[4], uri: prep.uri });
        } else if (prep.type === 'form') {
          var m = arrOf(dget(prep.dict, 'Matrix')), nctm = ctm.slice();
          if (m && m.length >= 6) {
            nctm = mmul([numOf(m[0]), numOf(m[1]), numOf(m[2]), numOf(m[3]), numOf(m[4]), numOf(m[5])], ctm);
          }
          runTokens(prep.toks, prep.res || resDict, nctm, items, depth + 1);
        }
      }

      for (i = 0; i < toks.length; i++) {
        t = toks[i];
        if (t.t !== 'kw') { args.push(t); if (args.length > 64) args.shift(); continue; }
        op = t.v;
        switch (op) {
          case 'q': pushSt(); break;
          case 'Q': popSt(); break;
          case 'cm': ctm = mmul([N(0), N(1), N(2), N(3), N(4), N(5)], ctm); break;
          case 'BT': tm = [1, 0, 0, 1, 0, 0]; tlm = tm.slice(); break;
          case 'Tf':
            // 内容流里写的是资源名 /F1，不是对象引用
            var ft = args[0];
            font = (ft && ft.t === 'name' && rdFonts) ? (rdFonts[ft.v] || null) : null;
            if (N(1)) tfs = Math.abs(N(1));
            break;
          case 'Td': tlm = tmAdvance(tlm, N(0), N(1)); tm = tlm.slice(); break;
          case 'TD': tl = -N(1); tlm = tmAdvance(tlm, N(0), N(1)); tm = tlm.slice(); break;
          case 'Tm': tm = [N(0), N(1), N(2), N(3), N(4), N(5)]; tlm = tm.slice(); break;
          case 'T*': tlm = tmAdvance(tlm, 0, -tl); tm = tlm.slice(); break;
          case 'TL': tl = N(0); break;
          case 'Tz': th = (N(0) || 100) / 100; break;
          case 'Ts': rise = N(0); break;
          case 'Tc': tc = N(0); break;
          case 'Tw': tw = N(0); break;
          case 'Tj': show(S(0)); break;
          case 'TJ':
            arr = null;
            for (a2 = 0; a2 < args.length; a2++) if (args[a2].t === 'arr') arr = args[a2].v;
            if (arr) {
              for (k2 = 0; k2 < arr.length; k2++) {
                el = arr[k2];
                if (!el) continue;
                if (el.t === 'str') show(el.v);
                else if (el.t === 'num') {
                  adj = el.v;
                  if (Math.abs(adj) >= 180) items.push({ t: 'sp' });
                  tm = tmAdvance(tm, -(adj / 1000) * tfs * th, 0);
                }
              }
            }
            break;
          case "'": tlm = tmAdvance(tlm, 0, -tl); tm = tlm.slice(); show(S(0)); break;
          case '"': tw = N(0); tc = N(1); tlm = tmAdvance(tlm, 0, -tl); tm = tlm.slice(); show(S(2)); break;
          case 'Do': doXObj(args[0]); break;

        }

    }

    function layoutItems(items) {
      var txts = [], imgs = [], i, o;
      for (i = 0; i < items.length; i++) {
        o = items[i];
        if (o.t === 'txt') txts.push(o);
        else if (o.t === 'img') imgs.push(o);
        else if (o.t === 'sp' && txts.length) txts[txts.length - 1].str += ' ';
      }
      txts.sort(function (a, c) { return (c.y - a.y) || (a.x - c.x); });
      var lines = [], cur = null;
      for (i = 0; i < txts.length; i++) {
        o = txts[i];
        if (cur && Math.abs(o.y - cur.y) <= Math.max(2, cur.s * 0.45)) {
          cur.items.push(o);
          cur.y = (cur.y * (cur.items.length - 1) + o.y) / cur.items.length;
        } else {
          cur = { y: o.y, s: o.s, items: [o] };
          lines.push(cur);
        }
      }
      var out = [];
      for (i = 0; i < lines.length; i++) {
        var line = lines[i];
        line.items.sort(function (a, c) { return a.x - c.x; });
        var s = '', lastEnd = null, x0 = null, k, it;
        for (k = 0; k < line.items.length; k++) {

          if (lastEnd !== null && it.x - lastEnd > Math.max(1.5, it.s * 0.22)) {
            if (s && !/\s$/.test(s)) s += ' ';
          }
          s += it.str;
          lastEnd = it.x + estEm(it.str) * it.s;
        }
        var str2 = s.replace(/\s+$/, '');
        if (!str2) continue;
        out.push({ y: line.y, s: line.s, x0: x0 === null ? 0 : x0, x1: lastEnd === null ? 0 : lastEnd, str: str2 });
      }
      imgs.sort(function (a, c) { return c.y - a.y; });

    function pageToHTML(pg, laid) {
      var lines = laid.lines, imgs = laid.imgs, out = [], li = 0, ii = 0;
      var right = (pg.mb && pg.mb.length >= 4) ? Math.max(pg.mb[2] - pg.mb[0], 1) : 612;
      while (li < lines.length || ii < imgs.length) {
        var useImg = false;
        if (ii < imgs.length) {
          if (li >= lines.length) useImg = true;
          else if (imgs[ii].y > lines[li].y) useImg = true;
        }
        if (useImg) {

    async function extractPage(pg) {

      for (i = 0; i < list.length; i++) {
        e = list[i];
        num = (e && e.t === 'ref') ? e.v : null;
        r = (num !== null) ? getRaw(num) : null;
        if (r && r.stream) {
          d = await decodeStream(r.obj, r.stream);
          if (d && d.length) bytes = concatU8(bytes, d);
        }

      if (!bytes.length) return '';
      var items = [];
      runTokens(tokenizeContent(bytes), pg.res, [1, 0, 0, 1, 0, 0], items, 0);

    /* ---------- 页面树 ---------- */
    function collectPages(refOrObj, inh, out, depth) {
      if (depth > 40) return;

      var node = res(refOrObj);
      if (!node || node.t !== 'dict') return;

      var rs = dget(node, 'Resources') || inh.rs;
      var kids = arrOf(dget(node, 'Kids'));
      var type = nameOf(dget(node, 'Type'));
      var mbv = arrOf(mb);

          num: num,
          mb: mbv ? mbv.map(numOf) : [0, 0, 612, 792],

        });

    /* ---------- 书签（Outline） ---------- */
    function buildOutline(rootDict, pageByNum) {

      function destPage(nd) {

        var arr = arrOf(dest);

        var pr = arr[0];

        if (depth > 12) return;
        var nd = res(ref);
        if (!nd || nd.t !== 'dict') return;
        var title = cleanLabel(strOf(dget(nd, 'Title')));
        var idx = destPage(nd);
        if (idx >= 0) result.push({ label: title || ('第 ' + (idx + 1) + ' 页'), index: idx, level: Math.min(level, 2) });
        var f = dget(nd, 'First');
        if (f) walk(f, level + 1, depth + 1);
        var nx = dget(nd, 'Next');
        if (nx) walk(nx, level, depth + 1);

    /* ---------- 主流程 ---------- */
    var trailer = await readAllXrefs();
    if (!trailer || !Object.keys(xref).length) {
      bruteScan();
      if (!trailer) {
        var ri = findBytes(b, '/Root', 0);
        if (ri >= 0) {
          var rr = pdfRef(b, ri + 5);
          if (rr[0] && rr[0].t === 'ref') trailer = { t: 'dict', v: { Root: rr[0] } };
        }
      }
