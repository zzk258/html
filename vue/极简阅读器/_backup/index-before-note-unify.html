    if (!trailer) throw new Error('PDF 结构损坏，读不出交叉引用表');
    if (dget(trailer, 'Encrypt')) throw new Error('这个 PDF 已加密，无法读取');

    await prepareObjStms();

    var root = res(dget(trailer, 'Root'));
    if (!root || root.t !== 'dict') throw new Error('PDF 结构损坏：找不到文档根节点');

    var pagesList = [];
    // 根节点是 Catalog，真正的页面树在 /Pages 下面
    collectPages(dget(root, 'Pages') || dget(trailer, 'Root'), { mb: null, rs: null }, pagesList, 0);
    if (!pagesList.length) throw new Error('这个 PDF 里没有找到任何页面');

    var pageByNum = {}, i;
    for (i = 0; i < pagesList.length; i++) if (pagesList[i].num !== null && pagesList[i].num !== undefined) pageByNum[pagesList[i].num] = i;

    var info = res(dget(trailer, 'Info'));
    var metaTitle = strOf(dget(info, 'Title'));
    var metaAuthor = strOf(dget(info, 'Author'));

    var chapters = [], emptyPages = 0;
    for (i = 0; i < pagesList.length; i++) {
      var html = '';
      try { html = await extractPage(pagesList[i]); } catch (e) { html = ''; }
      if (!html) {
        emptyPages++;
        html = '<p class="pl pempty">（第 ' + (i + 1) + ' 页没有可提取的文字，可能是扫描图片页）</p>';
      }
      chapters.push({
        path: 'pdf-' + i, href: 'pdf-' + i,
        html: '<div class="pgno">第 ' + (i + 1) + ' 页</div>' + html
      });
    }

    var toc = buildOutline(root, pageByNum) || [];
    if (!toc.length) {
      var step = pagesList.length > 80 ? 10 : (pagesList.length > 30 ? 5 : 1);
      for (i = 0; i < pagesList.length; i += step) {
        var end = Math.min(i + step, pagesList.length);
        toc.push({
          label: (step === 1) ? ('第 ' + (i + 1) + ' 页') : ('第 ' + (i + 1) + '–' + end + ' 页'),
          index: i, level: 0
        });
      }
    }

    return {
      buf: null, zip: null, base: '', manifest: {},
      chapters: chapters, toc: toc,
      meta: { title: metaTitle, creator: metaAuthor },
      kind: 'pdf', emptyPages: emptyPages,
      note: (emptyPages === chapters.length)
        ? '这个 PDF 整本都没有文字层（扫描件 / 纯图片），无法提取正文。请先做 OCR 转成文字版 PDF。'
        : (emptyPages > 0 ? '有 ' + emptyPages + ' 页是纯图片页，没有文字可提取。' : '')
    };
  }

  /* ================= 渲染 ================= */

  async function buildDocument(book) {
    // 图片统一转成 data URI：file:// 下 blob URL 不可靠，data URI 是绝对安全的
    var dataURIs = {};
    function toDataURI(bytes, type) {
      var bin = '', chunk = 0x8000;
      for (var i = 0; i < bytes.length; i += chunk) {
        bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
      }
      return 'data:' + type + ';base64,' + btoa(bin);
    }
    async function getDataURI(path) {
      if (dataURIs[path]) return dataURIs[path];
      var e = findEntry(book.zip, path);
      if (!e) return null;
      var bytes = await readEntryRaw(book.buf, e);
      var uri = toDataURI(bytes, guessType(path));
      dataURIs[path] = uri;
      return uri;
    }

    var cssCache = {};
    async function getCSS(path) {
      if (cssCache[path] !== undefined) return cssCache[path];
      try {
        var r = resolvePath(dirname(path), '');
        var e = findEntry(book.zip, path);
        if (!e) { cssCache[path] = ''; return ''; }
        var txt = await readText(book.buf, book.zip, path);
        cssCache[path] = txt;
        return txt;
      } catch (err) { cssCache[path] = ''; return ''; }
    }

    var parts = [];
    for (var i = 0; i < book.chapters.length; i++) {
      var ch = book.chapters[i];
      var html = '';
      try {
        // MOBI 的正文在解析阶段就已经解码好了，直接拿；EPUB 才需要从压缩包读
        html = (ch.html != null) ? ch.html : await readText(book.buf, book.zip, ch.path);
      } catch (e) { html = '<p>（本章无法读取）</p>'; }

      var doc = new DOMParser().parseFromString(html, 'text/html');
      var chBase = dirname(ch.path);

      // 书籍中的脚本一律剥离：避免干扰阅读器，也更安全
      var scripts = doc.querySelectorAll('script');
      for (var s = 0; s < scripts.length; s++) { scripts[s].remove(); }

      // 内联 <link rel=stylesheet>
      var links = doc.querySelectorAll('link[rel~="stylesheet"]');
      for (var a = 0; a < links.length; a++) {
        var href = links[a].getAttribute('href');
        var rp = resolvePath(chBase, href);
        if (!rp) { links[a].remove(); continue; }
        var css = await getCSS(rp.path);
        var styleEl = doc.createElement('style');
        styleEl.textContent = css;
        if (links[a].parentNode) links[a].parentNode.insertBefore(styleEl, links[a]);
        links[a].remove();
      }

      // 图片 → blob URL
      var imgs = doc.querySelectorAll('img');
      for (var b = 0; b < imgs.length; b++) {
        var src = imgs[b].getAttribute('src');
        var r2 = resolvePath(chBase, src);
        if (!r2) continue;
        var url = await getDataURI(r2.path);
        if (url) imgs[b].setAttribute('src', url);
      }

      // svg image 引用
      var imgRefs = doc.querySelectorAll('image');
      for (var c2 = 0; c2 < imgRefs.length; c2++) {
        var h2 = imgRefs[c2].getAttribute('xlink:href') || imgRefs[c2].getAttribute('href');
        var r3 = resolvePath(chBase, h2);
        if (!r3) continue;
        var u3 = await getDataURI(r3.path);
        if (u3) {
          imgRefs[c2].setAttribute('href', u3);
          imgRefs[c2].setAttribute('xlink:href', u3);
        }
      }

      // 内部链接 → 章节锚点
      var anchors = doc.querySelectorAll('a[href]');
      for (var d = 0; d < anchors.length; d++) {
        var ah = anchors[d].getAttribute('href');
        if (!ah || ah.charAt(0) === '#') continue;
        var r4 = resolvePath(chBase, ah);
        if (!r4) continue;
        var idx = -1;
        for (var e2 = 0; e2 < book.chapters.length; e2++) {
          if (book.chapters[e2].path === r4.path) { idx = e2; break; }
        }
        if (idx >= 0) anchors[d].setAttribute('href', '#ch-' + idx);
      }

      var body = doc.body ? doc.body.innerHTML : '';
      parts.push('<div class="epub-chapter" id="ch-' + i + '" data-index="' + i + '">' + body + '</div>');
    }

    var css = [
      'html,body{margin:0;padding:0;background:#fff;}',
      'body{padding:28px 0;}',
      '.epub-chapter{max-width:var(--colw,760px);margin:0 auto;padding:0 34px 46px;font-size:inherit;}',
      '.epub-chapter img{max-width:100%;height:auto;}',
      '.epub-chapter p{line-height:1.85;}',
      /* PDF 抽取出来的文本 */
      '.pgno{font-size:.72em;color:#9aa3b2;text-align:right;margin:0 0 14px;letter-spacing:.5px;}',
      '.pl{margin:0 0 .55em;text-align:justify;word-break:break-word;}',
      '.pempty{color:#9aa3b2;font-size:.9em;text-align:center;}',
      '.pimg{text-align:center;margin:16px 0;}',
      '.pimg img{max-width:100%;height:auto;}',
      'body{font-size:' + state.fontSize + 'px;}'
    ].join('\n');

    return '<!DOCTYPE html><html><head><meta charset="utf-8"><style>' + css +
           '</style></head><body>' + parts.join('\n') + '</body></html>';
  }

  function guessType(path) {
    var lower = path.toLowerCase();
    if (/\.jpe?g$/.test(lower)) return 'image/jpeg';
    if (/\.png$/.test(lower)) return 'image/png';
    if (/\.gif$/.test(lower)) return 'image/gif';
    if (/\.svg$/.test(lower)) return 'image/svg+xml';
    if (/\.webp$/.test(lower)) return 'image/webp';
    if (/\.css$/.test(lower)) return 'text/css';
    if (/\.(otf|ttf)$/.test(lower)) return 'font/otf';
    if (/\.woff2?$/.test(lower)) return 'font/woff';
    return 'application/octet-stream';
  }

  /* ================= 打开书籍 ================= */

  async function openBook(file) {
    openNotePanel(false);
    showLoading('正在解析电子书…');
    try {
      if (typeof DecompressionStream === 'undefined') {
        throw new Error('当前浏览器不支持 DecompressionStream。\n请使用 Chrome / Edge 103+ 或 Firefox 113+ 打开本文件。');
      }

      var lower = (file.name || '').toLowerCase();
      var head = new Uint8Array(await file.slice(0, 4096).arrayBuffer());
      var pdfPos = findBytes(head, '%PDF', 0);
      var isPdf = /\.pdf$/i.test(lower) || (pdfPos >= 0 && pdfPos < 1024);
      var isMobi = !isPdf && (/\.(mobi|azw|azw3|pdb)$/.test(lower) || magicOf(head, 60) === 'BOOK');
      var isTxt = !isPdf && !isMobi && /\.txt$/i.test(lower);
      var book = isPdf ? await loadPdf(file)
        : (isMobi ? await loadMobi(file)
          : (isTxt ? await loadTxt(file) : await loadEpub(file)));

      state.buf = book.buf;
      state.zip = book.zip;
      state.chapters = book.chapters;
      state.kind = book.kind || (isPdf ? 'pdf' : (isMobi ? 'mobi' : (isTxt ? 'txt' : 'epub')));
      state.bookDebug = book.debug || null;
      state.fileName = file.name;
      state.currentChapter = 0;
      cancelRestore();                 // 换书：把上一本残留的自动校正定时器收干净
      userScrolled = false;

      // 目录：先规范化，再兜底（保证任何时候都有目录可看）
      var toc = normalizeTOC(book.toc, book.chapters.length);
      if (!toc.length) toc = fallbackTOC(book);
      inferTOCLevels(toc);
      state.toc = toc;

      state.bookTitle = book.meta.title || file.name.replace(/\.(epub|mobi|azw3?|pdb|pdf)$/i, '');
      state.bookAuthor = book.meta.creator || '未知作者';
      $('meta-title').textContent = state.bookTitle;
      $('meta-author').textContent = state.bookAuthor;
      $('meta-title').title = state.bookTitle;          // 悬停可看完整书名
      $('meta-author').title = state.bookAuthor;
      state.note = book.note || '';   // 等界面就绪后再提示，免得被加载层盖掉

      // 笔记按书独立：每本书有自己的草稿和自己的文件
      loadDraft();
      setNoteStatus('');

      // 目录立刻渲染，不依赖 iframe 加载完成
      renderTOCList();

      var doc = await buildDocument(book);
      viewer.srcdoc = doc;

      var settled = false;
      var settleDeadline = Date.now() + 60000;
      function settle() {
        // 必须等 iframe 真正装好这一本再收尾：否则会拿着上一本书的文档去定位章节
        var probe = getIFrameDoc();
        var readyDoc = probe && probe.querySelectorAll('.epub-chapter').length === state.chapters.length;
        if (!readyDoc) {
          if (Date.now() < settleDeadline) { setTimeout(settle, 250); return; }
        }
        if (settled) return;
        settled = true;
        applyTheme(state.theme);
        applyFontSize(state.fontSize);
        applyColumnWidth();
        renderTOCList();
        var saved = readPos();
        var idx = saved ? saved.idx : 0;
        var off = saved ? saved.off : 0;
        var back = !!(saved && (idx > 0 || off > 40));
        goChapter(idx, true);
        bindIframeScroll();
        if (back) restoreSavedPos(idx, off);   // goChapter 只到章首，章内偏移在这之后补
        hideLoading();
        state.ready = true;
        if (state.note) { showToast(state.note, true); state.note = ''; }
        else if (back) showToast('已回到上次读到：' + tocLabelOf(idx));
      }
      viewer.onload = settle;
      // 兜底：万一 iframe 的 load 事件没触发，2.5 秒后照样进入可阅读状态
      setTimeout(settle, 2500);

      welcome.classList.add('hide');
      app.classList.add('show');
    } catch (err) {
      hideLoading();
      showToast('打开失败：' + (err && err.message ? err.message : String(err)));
    }
  }

  /* ================= 目录 ================= */

  // 目录项一律先过这里：丢掉越界项、补上缺失的标题、去掉重复（锚点不同就不算重复）
  function normalizeTOC(toc, n) {
    var out = [], seen = {}, i, it, idx, label, key;
    for (i = 0; i < (toc ? toc.length : 0); i++) {
      it = toc[i];
      if (!it) continue;
      idx = parseInt(it.index, 10);
      if (isNaN(idx) || idx < 0 || idx >= n) continue;
      label = cleanLabel(it.label);
      key = idx + '|' + label + '|' + (it.frag || '');
      if (seen[key]) continue;
      seen[key] = 1;
      out.push({
        label: label || ('第 ' + (idx + 1) + ' 节'),
        index: idx,
        level: Math.min(it.level || 0, 5),
        frag: it.frag || ''
      });
    }
    return out;
  }

  // 目录本身不带层级（很多 mobi / txt 只有一层平铺，level 全是 0）：
  // 按"卷 / 篇 / 章 / 节"这类写法补一层出来，目录才有树形层次
  // 两种写法都要认：「第一篇」数字在前字在后，「篇一」字在前数字在后，
  // 缺了前一种，市面上大多数书（第一篇 / 第1章）全都会漏掉
  var NUM = '[0-9０-９一二三四五六七八九十百千零两]+';
  var LVL_RULES = [
    { re: new RegExp('第\\s*' + NUM + '\\s*(?:卷|部|编|篇)|(?:卷|部|编|篇)\\s*[0-9０-９一二三四五六七八九十百千两]'), lv: 0 },
    { re: /^(?:序|序言|前言|引言|引子|楔子|后记|尾声|附录|导论|导言)/, lv: 0 },
    { re: new RegExp('第\\s*' + NUM + '\\s*(?:章|回)|(?:章|回)\\s*[0-9０-９一二三四五六七八九十百千两]'), lv: 1 },
    { re: new RegExp('第\\s*' + NUM + '\\s*(?:节|讲|课)|(?:节|讲|课)\\s*[0-9０-９一二三四五六七八九十百千两]'), lv: 2 }
  ];
  function inferTOCLevels(items) {
    if (!items || items.length < 4) return;
    var i, j, s, lv, min = 99, hit = 0, got = new Array(items.length);
    for (i = 0; i < items.length; i++) {
      if (items[i].level > 0) return;      // 本来就有层级，一行都别动
      s = String(items[i].label || '');
      for (j = 0; j < LVL_RULES.length; j++) {
        if (LVL_RULES[j].re.test(s)) { lv = LVL_RULES[j].lv; break; }
      }
      if (lv === undefined || lv === null) continue;
      got[i] = lv; hit++;
      if (lv < min) min = lv;
      lv = null;
    }
    // 认出来的还不到一半，就别硬分了，平铺比乱分层好
    if (hit < items.length * 0.5) return;
    for (i = 0; i < items.length; i++) {
      if (got[i] === undefined) got[i] = 0;
      items[i].level = Math.max(0, got[i] - min);
    }
  }

  // 兜底：拿不到目录时，用每一章自己的标题/首段造一个
  function chapterTitle(ch) {
    var label = '';
    if (ch && ch.html) {
      try {
        var d = new DOMParser().parseFromString(ch.html, 'text/html');
        var h = d.querySelector('h1,h2,h3,h4,h5,h6');
        if (h && cleanLabel(h.textContent)) label = cleanLabel(h.textContent);
        if (!label) {
          var p = d.querySelector('p');
          if (p) label = cleanLabel(p.textContent);
        }
      } catch (e) {}
    }
    if (!label && ch && ch.path) {
      var nm = String(ch.path).split('/').pop().replace(/\.(x?html|htm|xml)$/i, '');
      if (nm && nm !== ch.path) label = nm;
    }
    return label ? label.slice(0, 60) : '';
  }

  function fallbackTOC(book) {
    var out = [], i;
    for (i = 0; i < book.chapters.length; i++) {
      out.push({ label: chapterTitle(book.chapters[i]) || ('第 ' + (i + 1) + ' 节'), index: i, level: 0 });
    }
    return out;
  }

  // 目录本来是一张带 level 的平铺表，先按 level 组装成树
  function buildTOCTree(items) {
    var root = { children: [], level: -1 };
    var stack = [root], i, it, lv, node;
    for (i = 0; i < items.length; i++) {
      it = items[i];
      lv = it.level || 0;
      while (stack.length > 1 && stack[stack.length - 1].level >= lv) stack.pop();
      node = { label: it.label, index: it.index, level: lv, frag: it.frag || '', children: [] };
      stack[stack.length - 1].children.push(node);
      stack.push(node);
    }
    return root;
  }

  function renderTOCList() {
    var list = $('toc-list');
    list.innerHTML = '';
    if (!state.toc || !state.toc.length) {
      list.innerHTML = '<div class="toc-empty">本书没有目录</div>';
      $('toc-head').textContent = '目录';
      return;
    }
    $('toc-head').textContent = '目录 · ' + state.toc.length + ' 项';
    var root = buildTOCTree(state.toc), frag = document.createDocumentFragment();
    for (var i = 0; i < root.children.length; i++) appendTOCNode(frag, root.children[i], 0);
    list.appendChild(frag);
    highlightTOC(state.currentChapter);
    syncToggleAll();
  }

  // 目录头上的"折叠全部 / 展开全部"：只动有子项的那些行
  function tocParents() { return document.querySelectorAll('#toc-list .toc-item.parent'); }
  function syncToggleAll() {
    var el = $('toc-toggle-all');
    if (!el) return;
    var ps = tocParents(), anyOpen = false, i;
    for (i = 0; i < ps.length; i++) if (!ps[i].classList.contains('closed')) { anyOpen = true; break; }
    el.textContent = anyOpen ? '折叠全部' : '展开全部';
    el.style.display = ps.length ? '' : 'none';   // 平铺目录没有层级，按钮就没必要出现
  }
  function toggleAllTOC() {
    var ps = tocParents(), anyOpen = false, i, ar;
    for (i = 0; i < ps.length; i++) if (!ps[i].classList.contains('closed')) { anyOpen = true; break; }
    for (i = 0; i < ps.length; i++) {
      if (anyOpen) ps[i].classList.add('closed'); else ps[i].classList.remove('closed');
      ar = ps[i].querySelector('.toc-arrow');
      if (ar) ar.textContent = anyOpen ? '▸' : '▾';
    }
    syncToggleAll();
  }

  function appendTOCNode(parent, node, depth) {
    var hasKids = node.children.length > 0;
    var row = document.createElement('div');
    row.className = 'toc-item d' + depth + (hasKids ? ' parent' : '');
    row.title = node.label;
    row.setAttribute('data-index', node.index);
    row.setAttribute('data-frag', node.frag || '');

    var arrow = document.createElement('span');
    arrow.className = 'toc-arrow' + (hasKids ? '' : ' leaf');
    // 目录很长时，第 3 层往下先收着，免得一打开就是一大坨（当前章所在的分支仍会自动展开）
    var startClosed = hasKids && depth >= 2 && state.toc.length > 60;
    if (startClosed) row.classList.add('closed');
    arrow.textContent = startClosed ? '▸' : '▾';
    if (hasKids) {
      // 点三角只折叠/展开，点标题还是跳章节
      arrow.addEventListener('click', function (e) {
        e.stopPropagation();
        var closed = row.classList.toggle('closed');
        arrow.textContent = closed ? '▸' : '▾';
        syncToggleAll();
      });
    }
    row.appendChild(arrow);

    var text = document.createElement('span');
    text.className = 't';
    text.textContent = node.label;
    row.appendChild(text);
    row.addEventListener('click', makeTOCClick(node.index, node.frag, node.label));
    parent.appendChild(row);

    if (node.children.length) {
      var box = document.createElement('div');
      box.className = 'toc-children';
      for (var i = 0; i < node.children.length; i++) appendTOCNode(box, node.children[i], depth + 1);
      parent.appendChild(box);
    }
  }

  function makeTOCClick(idx, frag, label) {
    return function () { goChapter(idx, false, frag || '', label || ''); };
  }

  // 目录栏收起/展开也要记住，免得每次重开都要重新摆一遍
  function applyTocCollapsed() {
    var c = store.get('epubr:toccol') === '1';
    $('toc').classList.toggle('collapsed', c);
    $('btn-toc').classList.toggle('active', !c);
  }

  function highlightTOC(idx) {
    var nodes = document.querySelectorAll('#toc-list .toc-item');
    /* 一本书里常常有好几条目录指向同一个章节文件（整篇塞在一页里）：
       先按锚点 + 标题精确命中点击的那一条，再退回同锚点，最后才按章节号 */
    var curFrag = state.currentFrag || '', curLabel = state.currentLabel || '';
    var exact = null, sameFrag = null, anyIdx = null, i, row, f;
    for (i = 0; i < nodes.length; i++) {
      row = nodes[i];
      if (parseInt(row.getAttribute('data-index'), 10) !== idx) continue;
      if (!anyIdx) anyIdx = row;
      f = row.getAttribute('data-frag') || '';
      if (f !== curFrag) continue;
      if (!sameFrag) sameFrag = row;
      if (curLabel && (row.getAttribute('title') || '') === curLabel && !exact) exact = row;
    }
    var first = exact || sameFrag || anyIdx;
    for (var j = 0; j < nodes.length; j++) nodes[j].classList.remove('current');
    if (first) first.classList.add('current');
    // 当前章要是缩在某个折叠的分组里，先把它的祖先全部展开，否则永远看不到高亮
    if (first) expandAncestors(first);
    scrollTOCIntoView(first);
  }

  function expandAncestors(el) {
    var p = el.parentNode;
    while (p && p.id !== 'toc-list') {
      if (p.classList && p.classList.contains('toc-children')) {
        var prev = p.previousElementSibling;
        if (prev && prev.classList.contains('toc-item')) {
          prev.classList.remove('closed');
          var ar = prev.querySelector('.toc-arrow');
          if (ar) ar.textContent = '▾';
        }
      }
      p = p.parentNode;
    }
  }

  // 目录很长时（比如几百页的 PDF），让当前项自动滚到可见位置
  function scrollTOCIntoView(el) {
    var box = $('toc');
    if (!el || !box) return;
    var top = el.offsetTop - box.offsetTop;
    var target = top - box.clientHeight / 2 + el.offsetHeight / 2;
    if (target < 0) target = 0;
    if (Math.abs(box.scrollTop - target) > 8) box.scrollTop = target;
  }

  /* ================= 导航 ================= */

  function getIFrameDoc() {
    try { return viewer.contentDocument; } catch (e) { return null; }
  }

  // 在章节容器内找锚点对应的元素：先按 id 找，再按 <a name="..."> 找，找不到返回 null
  function findAnchorIn(root, frag) {
    if (!root || !frag) return null;
    var id = String(frag).replace(/^#/, '');
    if (!id) return null;
    try { id = decodeURIComponent(id); } catch (e) {}
    var sel = '[id="' + id.replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"]';
    try {
      var el = root.querySelector(sel);
      if (el) return el;
    } catch (e) {}
    var named = root.querySelectorAll('a[name]');
    for (var i = 0; i < named.length; i++) {
      if ((named[i].getAttribute('name') || '') === id) return named[i];
    }
    return null;
  }

  function normLabel(s) {
    return String(s || '').replace(/[\s\u00a0\u3000]+/g, '').toLowerCase();
  }

  function labelHit(text, want) {
    var s = normLabel(text);
    if (!s || !want) return false;
    if (s === want) return true;
    // 「第1章 解开忧虑之谜」对上「第1章 解开忧虑之谜（续）」这类长短不一的写法
    if (s.length >= 4 && (want.indexOf(s) === 0 || s.indexOf(want) === 0)) return true;
    return false;
  }

  /* 兜底定位：有的书目录 href 只写到文件、一个锚点都没有，整篇几章挤在同一页，
     这时按目录标题在章节里找同名标题，至少能落到具体的「第 X 章」那一行上 */
  function findLabelIn(root, label) {
    if (!root || !label) return null;
    var want = normLabel(label);
    if (want.length < 2) return null;
    var hits = root.querySelectorAll('h1,h2,h3,h4,h5,h6');
    var i, el;
    for (i = 0; i < hits.length; i++) {
      if (labelHit(hits[i].textContent, want)) return hits[i];
    }
    // 没有标题标签的书：只在短的 p / div 里找，且要求文字完全一致，避免误命中正文
    var blocks = root.querySelectorAll('p,div,strong,b');
    for (i = 0; i < blocks.length; i++) {
      el = blocks[i];
      if (el.children.length) continue;
      var t = cleanLabel(el.textContent);
      if (!t || t.length > 80) continue;
      if (normLabel(t) === want) return el;
    }
    return null;
  }

  function goChapter(idx, silent, frag, label) {
    idx = Math.max(0, Math.min(state.chapters.length - 1, idx));
    state.currentChapter = idx;
    state.currentFrag = frag || '';
    state.currentLabel = label || '';
    touchRecent(idx);
    var d = getIFrameDoc();
    if (d) {
      var chEl = d.getElementById('ch-' + idx);
      // 定位优先级：目录锚点 → 章内同名标题 → 这一章的开头
      var el = null;
      if (chEl) {
        if (frag) el = findAnchorIn(chEl, frag);
        if (!el && label) el = findLabelIn(chEl, label);
        if (!el) el = chEl;
      }
      if (el) {
        el.scrollIntoView({ block: 'start' });
      } else {
        viewer.contentWindow.scrollTo(0, 0);
      }
    }
    highlightTOC(idx);
    updatePager();
    // 主动翻章：进度落在这一章的开头；目录跳转到章内某处则记下那里的偏移，下次开书还能回到同一段
    if (frag || label) setTimeout(function () { savePos(); }, 150);
    else savePos(0);
    if (!silent) cancelRestore();               // 用户自己点了目录/翻页，就别再被开书时的自动校正拉回去
    if (notePanelOpen()) updateNoteSub(true);   // 主动翻页才算数，朗读时的滚动不算
    setTimeout(updateProgress, 60);
  }

  /* ================= 阅读位置记忆 ================= */
  /* localStorage 里存 "章节号|章内像素偏移"：打开书时先跳到那一章，再补上章内偏移，
     这样换字号、改版心宽度之后也还是回到上次那一段附近 */

  var saveTick = null, restoreTimers = [], userScrolled = false;

  function posKey() { return 'epubr:' + state.fileName; }

  function tocLabelOf(idx) {
    var t = state.toc || [];
    for (var i = 0; i < t.length; i++) { if (t[i] && t[i].index === idx) return t[i].label; }
    return '第 ' + (idx + 1) + ' 节';
  }

  function touchRecent(idx) {
    state.recent = { file: state.fileName, title: state.bookTitle, kind: state.kind, idx: idx,
                     h: !!state.handleSaved, l: tocLabelOf(idx) };   // h=已记住文件句柄；l=目录里的位置
  }

  function readPos() {
    var s = store.get(posKey());
    if (!s) return null;
    var p = String(s).split('|');
    var idx = parseInt(p[0], 10);
    if (isNaN(idx)) return null;
    var off = parseInt(p[1], 10);
    return { idx: idx, off: isNaN(off) ? 0 : off };
  }

  // 传 off 就按给定值写（翻章时是 0）；不传就按当前滚动位置算章内偏移
  function savePos(off) {
    if (!state.fileName) return;
    var d = getIFrameDoc(), win;
    try { win = viewer.contentWindow; } catch (e) { return; }
    if (!d || !win) return;
    var v = 0;
    if (typeof off === 'number') {
      v = off;
    } else {
      var el = d.getElementById('ch-' + state.currentChapter);
      v = el ? (win.scrollY - el.offsetTop) : win.scrollY;
    }
    if (!isFinite(v) || v < 0) v = 0;
    store.set(posKey(), state.currentChapter + '|' + Math.round(v));
  }

  function queueSavePos() {
    if (saveTick) clearTimeout(saveTick);
    saveTick = setTimeout(function () { saveTick = null; savePos(); }, 700);
  }

  function applySavedPos(idx, off) {
    if (userScrolled) return;
    var d = getIFrameDoc(), win;
    try { win = viewer.contentWindow; } catch (e) { return; }
    if (!d || !win) return;
    var el = d.getElementById('ch-' + idx);
    if (!el) return;
    var room = Math.max(0, (el.offsetHeight || 0) - win.innerHeight);   // 这一章比一屏还矮就直接回到章首
    win.scrollTo(0, (el.offsetTop || 0) + Math.min(off, room));
    updateProgress();
  }

  function restoreSavedPos(idx, off) {
    cancelRestore();
    userScrolled = false;
    // 图片、字体就位之前 offsetTop 还会漂，多校几次；用户一动滚轮就停手
    var delays = [0, 120, 350, 900, 1800];
    for (var i = 0; i < delays.length; i++) {
      restoreTimers.push(setTimeout(function () { applySavedPos(idx, off); }, delays[i]));
    }
  }

  function cancelRestore() {
    for (var i = 0; i < restoreTimers.length; i++) clearTimeout(restoreTimers[i]);
    restoreTimers = [];
  }

  function bindIframeScroll() {
    try {
      var win = viewer.contentWindow;
      win.addEventListener('scroll', onScroll, { passive: true });
      // 恢复位置期间，用户只要自己滚一下就彻底交还控制权
      var stop = function () { userScrolled = true; };
      win.addEventListener('wheel', stop, { passive: true });
      win.addEventListener('touchstart', stop, { passive: true });
      win.addEventListener('keydown', stop, { passive: true });
    } catch (e) {}
  }

  var scrollTick = null;
  function onScroll() {
    if (scrollTick) return;
    scrollTick = setTimeout(function () {
      scrollTick = null;
      updateProgress();
      detectChapter();
      queueSavePos();          // 章内滚动也要记下来，别只记到章节号
    }, 120);
  }

  function updateProgress() {
    var d = getIFrameDoc(), win;
    try { win = viewer.contentWindow; } catch (e) { return; }
    if (!d || !win) return;
    var body = d.body;
    var total = (body.scrollHeight || 0) - win.innerHeight;
    var pct = total > 0 ? Math.round((win.scrollY / total) * 100) : 0;
    if (pct < 0) pct = 0;
    if (pct > 100) pct = 100;
    $('progress-text').textContent = pct + '%';
    // 笔记面板开着时，跟着翻页刷新"当前位置"；朗读保护开着就别刷了，免得朗读滚动时父页面一直在改 DOM
    if (notePanelOpen() && !noteGuard) updateNoteSub();
  }

  function detectChapter() {
    var d = getIFrameDoc();
    if (!d) return;
    var nodes = d.querySelectorAll('.epub-chapter');
    var best = state.currentChapter, bestTop = Infinity;
    var scrollY = 0;
    try { scrollY = viewer.contentWindow.scrollY; } catch (e) {}
    for (var i = 0; i < nodes.length; i++) {
      var top = nodes[i].offsetTop - scrollY;
      if (top >= -40 && top < bestTop) { bestTop = top; best = parseInt(nodes[i].dataset.index, 10); }
    }
    if (!isNaN(best) && best !== state.currentChapter) {
      state.currentChapter = best;
      state.currentFrag = '';    // 自己滚到别的章了，之前目录跳转的锚点/标题就不再适用
      state.currentLabel = '';
      touchRecent(best);
      savePos();               // 连滚好几章没翻页就关掉，进度也不会丢
      highlightTOC(best);
      updatePager();
      if (notePanelOpen()) updateNoteSub(true);   // 换章才刷新，朗读滚屏不刷
    }
  }

  function updatePager() {
    var isPdf = (state.kind === 'pdf');
    $('btn-prev').textContent = isPdf ? '← 上一页' : '← 上一章';
    $('btn-next').textContent = isPdf ? '下一页 →' : '下一章 →';
    $('btn-prev').disabled = state.currentChapter <= 0;
    $('btn-next').disabled = state.currentChapter >= state.chapters.length - 1;
  }

  /* ================= 外观 ================= */

  function applyTheme(name) {
    state.theme = name;
    var t = THEMES[name] || THEMES.light;
    var d = getIFrameDoc();
    if (d) {
      var b = d.body;
      b.style.backgroundColor = t.bg;
      b.style.color = t.color;
      d.documentElement.style.backgroundColor = t.bg;
    }
    $('viewer-wrap').style.background = name === 'dark' ? '#2b2e34' : (name === 'sepia' ? '#efe6d3' : '#fafbfc');
    var dots = document.querySelectorAll('.theme-dot');
    for (var i = 0; i < dots.length; i++) {
      dots[i].classList.toggle('sel', dots[i].dataset.theme === name);
    }
    store.set('epubr:theme', name);
  }

  function applyFontSize(size) {
    state.fontSize = Math.min(30, Math.max(14, size));
    var d = getIFrameDoc();
    if (d && d.body) d.body.style.fontSize = state.fontSize + 'px';
    store.set('epubr:fontsize', state.fontSize);
    setTimeout(updateProgress, 80);
  }

  // 版心宽度：0 表示铺满；沉浸全屏时若用户没自定义过，自动放宽到 1000px
  function applyColumnWidth() {
    var immersive = document.body.classList.contains('immersive');
    var w = state.colWidth;
    if (immersive && w === 760) w = 1000;
    var d = getIFrameDoc();
    if (d && d.documentElement) {
      try { d.documentElement.style.setProperty('--colw', w ? w + 'px' : '100%'); } catch (e) {}
    }
    setTimeout(updateProgress, 80);
  }

  /* ================= 沉浸全屏 ================= */

  var dimTimer = null;
  function pokeExitBtn() {
    var el = $('fs-exit');
    if (!el) return;
    el.classList.remove('dim');
    if (dimTimer) clearTimeout(dimTimer);
    dimTimer = setTimeout(function () { el.classList.add('dim'); }, 2600);
  }

  function setImmersive(on) {
    var body = document.body;
    if (on === body.classList.contains('immersive')) { if (on) pokeExitBtn(); return; }
    if (on) {
      state.tocWasOpen = !$('toc').classList.contains('collapsed');
      body.classList.add('immersive');
      applyColumnWidth();
      pokeExitBtn();
    } else {
      body.classList.remove('immersive');
      applyColumnWidth();
      if (state.tocWasOpen === false) $('toc').classList.add('collapsed');
      else $('toc').classList.remove('collapsed');
    }
    setTimeout(updateProgress, 120);
  }

  function toggleImmersive() {
    var on = !document.body.classList.contains('immersive');
    setImmersive(on);
    if (on) {
      try {
        var p = document.documentElement.requestFullscreen();
        if (p && p.catch) p.catch(function () {});
      } catch (e) {}
      // 某些浏览器/本地文件下 requestFullscreen 会被拒绝，
      // 此时仍然生效的是"隐藏界面、正文铺满窗口"的沉浸模式
    } else if (document.fullscreenElement) {
      try { document.exitFullscreen(); } catch (e) {}
    }
  }

  function onFsChange() {
    if (!document.fullscreenElement && document.body.classList.contains('immersive')) {
      setImmersive(false);
    }
  }
  document.addEventListener('fullscreenchange', onFsChange);
  document.addEventListener('webkitfullscreenchange', onFsChange);
  document.addEventListener('mousemove', function () {
    if (document.body.classList.contains('immersive')) pokeExitBtn();
  });

  /* ================= 读书笔记 ================= */

  var noteDirHandle = null;   // 用户选定的保存文件夹（一个文件夹里每本书一个文件）
  var noteFileHandle = null;  // 用户挑定的具体笔记文件，之后静默更新它
  var nativeNoteDir = '';     // 打包版（Electron）里用户选定并记住的文件夹路径
  var nativeSuggestDir = '';  // 打包版第一次保存时建议的目录（文档\极简阅读器笔记）
  // 打包版（Electron）里由 preload.js 注入；HTML 直接打开时没有，走浏览器那套
  var IS_ELECTRON = /Electron/i.test(navigator.userAgent || '');
  var noteDraftTimer = null;
  // 朗读保护：浏览器正在朗读时，笔记面板一动不动地"靠边站"，不抢焦点、不跟着朗读滚动刷新
  var noteGuard = store.get('epubr:noteguard') === '1';
  var noteSubCache = '';
  var noteTocHidden = false;   // 记笔记时临时收起来的目录，关面板要还原

  function syncTocBtn() {
    $('btn-toc').classList.toggle('active', !$('toc').classList.contains('collapsed'));
  }

  function notePanelOpen() { return $('note-panel').classList.contains('show'); }

  function noteKey() { return 'epubr:note:' + (state.fileName || '未命名'); }

  // 书名可能带 Windows 文件名不允许的字符，先洗一遍
  function safeFileName(s) {
    s = String(s || '').replace(/[\\\/:*?"<>|\r\n\t]/g, '_').replace(/\s+/g, ' ').trim();
    s = s.replace(/^[.\s]+/, '').replace(/[.\s]+$/, '');
    return s ? s.slice(0, 60) : '读书笔记';
  }
  function noteFileName() { return safeFileName(state.bookTitle || state.fileName) + '.md'; }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return c === '&' ? '&amp;' : (c === '<' ? '&lt;' : (c === '>' ? '&gt;' : '&quot;'));
    });
  }

  function nowStamp() {
    var d = new Date();
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
           ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  // PDF 说“第 N 页”，其余用当前章节名
  function currentLocation() {
    if (state.kind === 'pdf') return '第 ' + (state.currentChapter + 1) + ' 页';
    var t = state.toc || [], label = '';
    for (var i = 0; i < t.length; i++) {
      if (t[i].index === state.currentChapter) { label = t[i].label; break; }
    }
    return label || ('第 ' + (state.currentChapter + 1) + ' 章');
  }

  function setNoteStatus(msg, isWarn) {
    var el = $('note-status');
    el.textContent = msg || '';
    el.className = isWarn ? 'note-status warn' : 'note-status';
  }

  // 保存成功的轻提示：只在状态栏位置闪一行小绿字（那行常驻占位，出现/消失都不会让面板跳动），
  // 路径、位置都在上方标注过了，不再重复念叨。
  var noteSavedTimer = null;
  function flashNoteSaved() {
    var el = $('note-status');
    if (noteSavedTimer) { clearTimeout(noteSavedTimer); noteSavedTimer = null; }
    el.textContent = '✓ 已保存 · ' + nowStamp();
    el.className = 'note-status ok';
    noteSavedTimer = setTimeout(function () {
      noteSavedTimer = null;
      if (el.className === 'note-status ok') { el.textContent = ''; el.className = 'note-status'; }
    }, 2600);
  }

  /* --- 把选定的文件夹句柄存进 IndexedDB，下次打开浏览器还能接着用 --- */
  var NOTE_STORE = 'handles';
  function idbOpen() {
    return new Promise(function (resolve, reject) {
      if (typeof indexedDB === 'undefined') { reject(new Error('no-idb')); return; }
      var req;
      try { req = indexedDB.open('epubr-notes', 1); } catch (e) { reject(e); return; }
      req.onupgradeneeded = function () {
        if (!req.result.objectStoreNames.contains(NOTE_STORE)) req.result.createObjectStore(NOTE_STORE);
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error || new Error('idb-open-failed')); };
    });
  }
  async function idbSet(k, v) {
    var db = await idbOpen();
    await new Promise(function (res, rej) {
      var tx = db.transaction(NOTE_STORE, 'readwrite');
      tx.objectStore(NOTE_STORE).put(v, k);
      tx.oncomplete = res;
      tx.onerror = function () { rej(tx.error); };
    });
    db.close();
  }
  async function idbGet(k) {
    var db = await idbOpen();
    var v = await new Promise(function (res, rej) {
      var tx = db.transaction(NOTE_STORE, 'readonly');
      var r = tx.objectStore(NOTE_STORE).get(k);
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
    db.close();
    return v;
  }

  /* --- 记住每本书的"文件句柄"：下次点历史条目时直接打开，不用再选一遍文件 ---
     浏览器不给网页真实路径（input 拿到的 File 里没有 path），能持久化的只有句柄。
     注意：这套接口（File System Access）只在 http(s)/localhost 下可用，
     双击本地 HTML（file://）时 window.showOpenFilePicker 根本不存在，只能退回选择框。 */
  function bookKey(name) { return 'book:' + (name || ''); }

  async function rememberBook(h) {
    try {
      if (h && (h.kind === 'file' || typeof h.getFile === 'function')) {
        await idbSet(bookKey(h.name), h);
        state.handleSaved = true;
      }
    } catch (e) {}
  }

  // 返回 File 表示"找到了、可以直接开"；返回 null 就退回手动选择
  async function reopenByHandle(name) {
    // 打包版：Electron 里句柄权限留不住，改按真实路径直接读，静默无弹框
    if (window.nativeBook && window.nativeBook.openPath) {
      var p = store.get('epubr:bookpath:' + (name || ''));
      if (p) {
        try {
          var r = await window.nativeBook.openPath(p);
          if (r && r.ok) { state.handleSaved = true; return new File([r.data], r.name); }
        } catch (e) {}
      }
      return null;
    }
    if (typeof window.showOpenFilePicker !== 'function') return null;
    try {
      var h = await idbGet(bookKey(name));
      if (!h || typeof h.queryPermission !== 'function') return null;
      var perm = await h.queryPermission({ mode: 'read' });
      if (perm === 'prompt') perm = await h.requestPermission({ mode: 'read' });
      if (perm !== 'granted') return null;
      return await h.getFile();      // 文件被移动/改名会在这里抛 NotFoundError
    } catch (e) { return null; }
  }

  var BOOK_TYPES = [{
    description: '电子书',
    accept: { 'application/octet-stream': ['.epub', '.mobi', '.azw', '.azw3', '.pdb', '.pdf', '.txt', '.text'] }
  }];

  /* ---- 选择框的起始目录 ----
     showOpenFilePicker 的 id 参数能让浏览器自己记住上次停在哪个文件夹；
     再兜一层：拿到文件句柄时若浏览器支持 getParent，就把那本书所在的文件夹也存下来。 */
  var startDirPref = store.get('epubr:startdir') || '';
  var bookDirHandle = null, lastDirHandle = null;

  async function dirGranted(h) {
    try {
      if (!h || typeof h.queryPermission !== 'function') return false;
      var p = await h.queryPermission({ mode: 'read' });
      if (p === 'prompt') p = await h.requestPermission({ mode: 'read' });
      return p === 'granted';
    } catch (e) { return false; }
  }

  async function pickStartDir() {
    if (startDirPref === 'custom') {
      try { if (!bookDirHandle) bookDirHandle = await idbGet('bookDir'); } catch (e) {}
      return (await dirGranted(bookDirHandle)) ? bookDirHandle : null;
    }
    if (startDirPref) return startDirPref;                 // downloads / desktop / documents
    try { if (!lastDirHandle) lastDirHandle = await idbGet('lastBookDir'); } catch (e) {}
    return (await dirGranted(lastDirHandle)) ? lastDirHandle : null;   // 都没有就交给浏览器的 id 记忆
  }

  async function rememberLastDir(h) {
    try {
      if (!h || typeof h.getParent !== 'function') return;
      var d = await h.getParent();
      if (!d) return;
      lastDirHandle = d;
      await idbSet('lastBookDir', d);
    } catch (e) {}
  }

  // 优先用"能记住句柄"的选择器；浏览器不支持（file://）就退回原来的 <input type=file>
  async function pickBookFSA() {
    if (typeof window.showOpenFilePicker !== 'function') return false;
    try {
      var opt = { id: 'epubr-book', multiple: false, excludeAcceptAllOption: false, types: BOOK_TYPES };
      var si = await pickStartDir();
      if (si) opt.startIn = si;                  // 固定书库，或上次那本书所在的文件夹
      var hs = await window.showOpenFilePicker(opt);
      var h = hs && hs[0];
      if (!h) return true;                       // 用户点了取消
      await rememberBook(h);
      await rememberLastDir(h);                  // 下次再选书，还从这个文件夹开始
      await openBook(await h.getFile());
      return true;
    } catch (e) {
      if (e && e.name === 'AbortError') return true;   // 取消选择，别再弹一次
      return false;                                    // 真出错了，走兜底
    }
  }

  function chooseBook() {
    // 打包版：走系统原生打开对话框，拿到真实路径存起来，之后点历史记录直接按路径重开
    if (window.nativeBook && window.nativeBook.open) {
      window.nativeBook.open().then(function (r) {
        if (!r || r.canceled) return;
        if (!r.ok) { showToast('打开失败：' + (r.error || '读不了这个文件'), true); return; }
        store.set('epubr:bookpath:' + r.name, r.path);
        state.handleSaved = true;
        openBook(new File([r.data], r.name));
      }).catch(function () { fileInput.click(); });
      return;
    }
    pickBookFSA().then(function (used) {
      if (used) return;
      if (typeof window.showOpenFilePicker !== 'function' && !store.get('epubr:pickhint')) {
        store.set('epubr:pickhint', '1');
        showToast('浏览器不允许网页指定选择框的目录（本地双击打开 file:// 时更是完全没有这个能力）。' +
          '想让选择框每次都停在上次那个文件夹，请用本地服务器方式打开本文件：' +
          '在本文件所在目录启动一个 http://localhost 服务，再访问该地址即可。', true);
      }
      fileInput.click();
    });
  }

  // 页面一打开就尝试恢复上次的文件夹；真正的写权限要等用户点保存时再要
  async function restoreNoteDir() {
    // 打包版：直接问主进程上次记住的文件夹，权限由系统管，不需要再跟用户要
    if (IS_ELECTRON && !(window.nativeBook && window.nativeNote)) {
      // 说明跑的是旧构建（或 app 目录里的 preload.js 缺失），明说比悄悄退回弹框的老路好
      setNoteStatus('原生通道没加载：请确认 app 目录里有 preload.js，并完全退出后重开。', true);
      showToast('原生通道没加载：请确认 app 目录里有 preload.js，并完全退出后重开。', true);
      return;
    }
    if (window.nativeNote && window.nativeNote.getDir) {
      try {
        var d = await window.nativeNote.getDir();
        nativeNoteDir = (d && d.dir) || '';
        nativeSuggestDir = (d && d.suggest) || '';
        updateNoteSub();
        return;
      } catch (e) {}
    }
    try {
      var h = await idbGet('noteDir');
      if (!h) return;
      noteDirHandle = h;
      updateNoteSub();
      var perm = await h.queryPermission({ mode: 'readwrite' });
      if (perm === 'granted') setNoteStatus('已恢复保存文件夹：' + (h.name || ''));
      else setNoteStatus('已记住上次的文件夹「' + (h.name || '') + '」，点“保存到文件”时浏览器会请你再确认一次。');
    } catch (e) { /* 恢复不了就按默认的下载目录走 */ }
  }

  // force=true 才能刷新：朗读保护开着时，滚动带来的滚动条刷新一律忽略
  function updateNoteSub(force) {
    if (noteGuard && !force) return;
    // 两种环境只有「保存位置」的来源不同：打包版由主进程给完整路径，网页版浏览器只肯给文件夹名。
    // 展示格式保持一致：文件 / 当前位置 / 保存到，三行，不附加任何说明文字
    var noPicker = (location.protocol === 'file:' && typeof window.showDirectoryPicker !== 'function');
    var where;
    if (window.nativeNote) {
      // 打包版：系统文件夹路径是确定的，直接显示出来，一眼就知道笔记落在哪
      where = nativeNoteDir ? nativeNoteDir
        : ('还没选（第一次保存时会请你选一次'
            + (nativeSuggestDir ? (', 建议 ' + nativeSuggestDir) : '') + '）');
    } else {
      // 网页版：浏览器只返回文件夹名（隐私限制），拿不到盘符路径。
      // 用户可以用「标注路径…」把真实路径手工记一次，之后就和打包版一样显示完整路径
      var noted = store.get('epubr:noteDirPath') || '';
      if (noted) where = noted;
      else if (noteDirHandle && noteDirHandle.name) where = noteDirHandle.name + '\\';
      else if (noteFileHandle && noteFileHandle.name) where = noteFileHandle.name;
      else where = '浏览器下载目录';
    }
    var html =
      '文件：<b>' + esc(noteFileName()) + '</b><br>' +
      '当前位置：<b>' + esc(currentLocation()) + '</b><br>' +
      '保存到：<b>' + esc(where) + '</b>';
    if (html !== noteSubCache) {
      noteSubCache = html;
      $('note-sub').innerHTML = html;
    }
    $('note-path-btn').style.display = window.nativeNote ? 'none' : '';
    $('note-dir-btn').style.display = (window.nativeNote || !noPicker) ? '' : 'none';
    $('note-dir-text').textContent = '保存位置：' + where;
    $('note-dir-clear').style.display = (window.nativeNote ? !!nativeNoteDir
      : !!(noteDirHandle || noteFileHandle)) ? '' : 'none';
  }

  function markNoteIcon() {
    var has = !!($('note-text').value || '').trim();
    $('note-fab').classList.toggle('has-note', has);
    $('btn-note').classList.toggle('has-note', has);
  }

  function saveDraft() {
    if (!state.fileName) return;
    store.set(noteKey(), $('note-text').value);
    markNoteIcon();
  }

  // 这本书上次存到哪个文件，重开后接着用那个
  async function loadNoteFileHandle() {
    try {
      var h = await idbGet('noteFile:' + (state.fileName || ''));
      if (!h) return;
      noteFileHandle = h;
      updateNoteSub();
      var perm = await h.queryPermission({ mode: 'readwrite' });
      setNoteStatus(perm === 'granted'
        ? '这本书的笔记文件已恢复：' + (h.name || '')
        : '找到这本书上次存的笔记文件「' + (h.name || '') + '」，点保存时会请你确认一次。');
    } catch (e) {}
  }

  function loadDraft() {
    noteFileHandle = null;   // 换书了，记住的那个文件属于上一本
    $('note-text').value = store.get(noteKey()) || '';
    markNoteIcon();
    noteSubCache = '';          // 换书了，面板里的文字别留着上一本的
    updateNoteSub(true);
    if (state.fileName) loadNoteFileHandle();
  }

  // 保存时自动加的抬头；读入文件时要把这部分剥掉，只留用户正文
  function noteFileText() {
    var head = '# ' + (state.bookTitle || '读书笔记') + '\n\n' +
      '> 作者：' + (state.bookAuthor || '未知') + '\n' +
      '> 文件：' + (state.fileName || '') + '\n' +
      '> 位置：' + currentLocation() + '\n' +
      '> 更新：' + nowStamp() + '\n\n---\n\n';
    return head + ($('note-text').value || '').replace(/\s+$/, '') + '\n';
  }

  function stripHeader(text) {
    text = String(text || '');
    if (!/^#\s/.test(text)) return text;
    var i = text.indexOf('\n---\n');
    if (i >= 0 && i < 400) return text.slice(i + 5).replace(/^\n+/, '');
    return text;
  }

  function downloadNote(text, name) {
    // 加 BOM，保证 Windows 记事本也按 UTF-8 打开
    var blob = new Blob(['\ufeff' + text], { type: 'text/markdown;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 2000);
  }

  async function writeToHandle(fh, text) {
    var opt = { mode: 'readwrite' };
    var perm = await fh.queryPermission(opt);
    if (perm !== 'granted') perm = await fh.requestPermission(opt);
    if (perm !== 'granted') throw new Error('没有写入权限');
    var w = await fh.createWritable();
    await w.write(text);
    await w.close();
  }

  async function saveNote() {
    if (!state.fileName) return;
    var body = ($('note-text').value || '').trim();
    if (!body) { setNoteStatus('还没有写内容，保存已取消。', true); return; }
    var name = noteFileName(), text = noteFileText();
    saveDraft();

    // 0) 打包版：默认目录里有这本书的文件就直接覆盖；找不着才弹一次让你定位置
    if (window.nativeNote && window.nativeNote.save) {
      try {
        var r = await window.nativeNote.save({ name: name, text: text });
        if (r && r.canceled) { setNoteStatus('已取消保存。', true); return; }
        if (r && r.ok) {
          nativeNoteDir = r.dir || nativeNoteDir;
          flashNoteSaved();          // 保存位置上方已标注，这里只闪一下“已保存”
          updateNoteSub(true);
          return;
        }
        // 原生通道报错要让用户看见，别悄悄退回弹框的老路
        if (r && r.ok === false) {
          setNoteStatus('原生保存失败：' + (r.error || '未知原因'), true);
          showToast('原生保存失败：' + (r.error || '未知原因'), true);
          return;                       // 打包版没有浏览器那套兜底，别再往下试
        }
      } catch (e) {
        var em = (e && e.message) ? e.message : String(e);
        setNoteStatus('原生保存出错：' + em, true);
        showToast('原生保存出错：' + em, true);
      }
    }

    // 1) 选过文件夹：按书名写进那个文件夹（每本书一个文件）
    if (noteDirHandle) {
      try {
        var dh = await noteDirHandle.getFileHandle(name, { create: true });
        await writeToHandle(dh, text);
        setNoteStatus('已写入文件夹：' + name + '（' + nowStamp() + '）');
        return;
      } catch (e) { /* 权限失效等情况，往下走下载 */ }
    }

    // 2) 之前挑过具体文件：静默更新它，不再打扰
    if (noteFileHandle) {
      try {
        await writeToHandle(noteFileHandle, text);
        setNoteStatus('已更新 ' + (noteFileHandle.name || name) + '（' + nowStamp() + '）');
        return;
      } catch (e) { /* 同上 */ }
    }

    // 3) 浏览器允许直接存盘：第一次让用户挑位置（可以挑程序旁边那个文件夹），之后记住
    if (typeof window.showSaveFilePicker === 'function') {
      try {
        noteFileHandle = await window.showSaveFilePicker({
          suggestedName: name,
          types: [{ description: '读书笔记', accept: { 'text/markdown': ['.md', '.txt'] } }]
        });
        await writeToHandle(noteFileHandle, text);
        await idbSet('noteFile:' + state.fileName, noteFileHandle);   // 这本书以后都存这个文件
        setNoteStatus('已保存到 ' + (noteFileHandle.name || name) + '，之后再点保存会直接更新它。');
        updateNoteSub();
        return;
      } catch (e) {
        // 用户自己点了取消，就别再弹下载了
        if (e && e.name === 'AbortError') { setNoteStatus('已取消保存。', true); return; }
      }
    }

    // 4) 兜底：走浏览器下载
    downloadNote(text, name);
    setNoteStatus('已保存到下载目录：' + name);
  }

  function openNotePanel(on) {
    var p = $('note-panel');
    if (on === undefined) on = !p.classList.contains('show');
    if (on && !state.fileName) { showToast('先打开一本书再记笔记。', true); return; }
    // 朗读保护：宽度一步到位，省掉过渡过程中那几百毫秒的连续重排
    p.classList.toggle('silent', noteGuard);

    if (on) {
      collapseTocForNote();
      $('note-title').textContent = state.bookTitle || '读书笔记';
      updateNoteSub(true);
      setNoteStatus(noteGuard ? '朗读保护已开：焦点留在正文，可以边听边写。' : '');
      var ta = $('note-text');
      // 抢焦点会把某些朗读器/朗读软件的焦点从正文带走，所以保护打开时不抢
      if (!noteGuard) {
        ta.focus();
        try { ta.setSelectionRange(ta.value.length, ta.value.length); } catch (e) {}
      }
    } else {
      restoreTocAfterNote();
    }
    setTimeout(updateProgress, 80);
  }

  // 网页版专用：浏览器出于隐私不向页面提供文件夹的完整路径，只给最后一级名字。

      if ($('note-panel').classList.contains('show')) openNotePanel(false);

    // 在笔记框里打字时，别触发翻页/目录这些快捷键
    var t = e.target;
    if (t && (t.tagName === 'TEXTAREA' || t.tagName === 'INPUT' || t.isContentEditable)) return;
    if (e.key === 'ArrowLeft') goChapter(state.currentChapter - 1, false);
    else if (e.key === 'ArrowRight') goChapter(state.currentChapter + 1, false);

      '　NCX索引:' + g.ncxIndex + '（' + g.ncxItems + ' 条）' +
      '　切章:' + g.split + '　共 ' + g.chapters + ' 章' +
      '　目录来源:' + g.tocSource);
  }

  /* ================= 最近阅读 ================= */
  /* 浏览器不允许网页自己重开上次那个文件，所以只能记住书名和进度，下次点一下再选文件 */

  function flushRecent() {
    if (!state.recent || !state.recent.file) return;
    try {
      var arr = [];
      try { arr = JSON.parse(store.get('epubr:recent') || '[]'); } catch (e) { arr = []; }
      arr = arr.filter(function (x) { return x && x.file !== state.recent.file; });
      arr.unshift(state.recent);
      store.set('epubr:recent', JSON.stringify(arr.slice(0, 6)));
    } catch (e) {}
  }
  window.addEventListener('pagehide', flushRecent);
  window.addEventListener('beforeunload', flushRecent);

  function flushPos() { savePos(); }   // 关页面前把"读到第几章、章内第几像素"落盘
  window.addEventListener('pagehide', flushPos);
  window.addEventListener('beforeunload', flushPos);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') { flushPos(); flushRecent(); }
  });

  function readRecent() {
    try {
      var a = JSON.parse(store.get('epubr:recent') || '[]');
      return (a && a.length) ? a : [];
    } catch (e) { return []; }
  }
  function writeRecent(arr) { store.set('epubr:recent', JSON.stringify(arr.slice(0, 6))); }

  /* 书名后面的格式后缀：优先取文件名里真实的扩展名（能区分 azw3 / azw / pdb），
     文件名没扩展名（或老记录缺字段）再退回解析出的书籍类型 */
  var FMT_BY_KIND = { epub: 'epub', mobi: 'mobi', kf8: 'azw3', azw: 'azw', azw3: 'azw3', pdb: 'pdb', pdf: 'pdf', txt: 'txt' };
  function fmtOfRecent(it) {
    var f = String((it && it.file) || '');
    var m = f.match(/\.([A-Za-z0-9]{2,5})$/);
    if (m) return m[1].toLowerCase();
    return FMT_BY_KIND[String((it && it.kind) || '').toLowerCase()] || '';
  }

  // 「选择」模式：勾掉哪几本就删哪几本（清空=全部，选择=部分）
  var recentSel = { on: false, picked: {} };
  // 每次打开都从折叠开始：不写 localStorage，免得上次手动展开的状态被记住
  var recentCollapsed = true;

  function renderRecent() {
    var box = $('recent');
    if (!box) return;
    var arr = readRecent();
    if (!arr.length) { box.innerHTML = ''; recentSel.on = false; recentSel.picked = {}; return; }

    var collapsed = recentCollapsed;                         // 默认折叠，点「最近阅读」才展开
    if (recentSel.on) collapsed = false;                    // 选择模式下强制展开
    var picked = 0, pk;
    for (pk in recentSel.picked) { if (recentSel.picked[pk]) picked++; }

    var btns = '';
    if (recentSel.on) {
      btns = '<button type="button" class="recent-btn danger' + (picked ? ' on' : '') + '" data-act="del"' +
        (picked ? '' : ' disabled') + '>删除选中' + (picked ? '（' + picked + '）' : '') + '</button>' +
        '<button type="button" class="recent-btn" data-act="all">全选</button>' +
        '<button type="button" class="recent-btn" data-act="done">完成</button>';
    } else {
      btns = '<button type="button" class="recent-btn" data-act="clear" title="删除全部历史记录">清空</button>' +
        '<button type="button" class="recent-btn" data-act="pick" title="勾选后只删指定的几条">选择</button>';
    }

    var html = '<div class="recent-head" title="点击折叠 / 展开　·　点条目重新选中该书文件，进度会自动接上">' +
      '<span class="recent-arrow">' + (collapsed ? '\u25b8' : '\u25be') + '</span>' +
      '<span class="recent-head-text">最近阅读（' + arr.length + ' 本）</span>' +
      '<span class="recent-btns">' + btns + '</span></div>';
    html += '<div class="recent-list"' + (collapsed ? ' style="display:none"' : '') + '>';
    for (var i = 0; i < arr.length; i++) {
      var it = arr[i];
      if (!it || !it.title) continue;
      var f = it.file || '';
      var at = it.l || (it.kind === 'pdf' ? '第 ' + ((it.idx || 0) + 1) + ' 页' : '第 ' + ((it.idx || 0) + 1) + ' 节');
      var on = recentSel.on && !!recentSel.picked[f];
      var hint = it.h ? '　已记住位置，点一下直接打开' : '　需手动选一次文件（选过之后下次直接打开）';
      // 格式后缀：书名本身已经带了的就别再加一遍
      var fmt = fmtOfRecent(it);
      if (fmt && String(it.title).toLowerCase().slice(-(fmt.length + 1)) === '.' + fmt) fmt = '';
      html += '<div class="recent-item' + (on ? ' picked' : '') + '" data-file="' + esc(f) + '" title="' +
        esc(it.title) + (fmt ? '.' + esc(fmt) : '') + '（' + esc(at) + '）' + hint + (recentSel.on ? '　点击勾选' : '') + '">' +
        (recentSel.on ? '<span class="recent-pick">' + (on ? '\u2713' : '') + '</span>' : '') +
        '<span class="recent-title">' +
          '<span class="recent-name">' + esc(it.title) + '</span>' +
          (fmt ? '<span class="recent-fmt">.' + esc(fmt) + '</span>' : '') +
        '</span>' +
        '<span class="recent-at">' + esc(at) + '</span></div>';
    }
    html += '</div>';
    box.innerHTML = html;

    // 标题栏：点一下展开 / 折叠（只在本次会话内记住，下次打开又是折叠）
    box.querySelector('.recent-head').addEventListener('click', function () {
      recentCollapsed = !recentCollapsed;
      renderRecent();
    });

    var clearArmed = false, clearTimer = null;
    var bts = box.querySelectorAll('.recent-btns .recent-btn');
    for (var b = 0; b < bts.length; b++) {
      bts[b].addEventListener('click', function (e) {
        e.stopPropagation();                 // 点按钮不要顺带折叠
        var act = this.getAttribute('data-act');
        var cur, k, fk;

        if (act === 'pick') {                // 进入选择模式（顺带展开，退出后也保持展开）
          recentSel.on = true; recentSel.picked = {}; recentCollapsed = false; renderRecent(); return;
        }
        if (act === 'done') {                // 退出选择模式
          recentSel.on = false; recentSel.picked = {}; renderRecent(); return;
        }
        if (act === 'all') {                 // 全选 / 取消全选
          cur = readRecent();
          var allOn = cur.length > 0;
          for (k = 0; k < cur.length; k++) { if (!recentSel.picked[cur[k].file || '']) allOn = false; }
          for (k = 0; k < cur.length; k++) { recentSel.picked[cur[k].file || ''] = !allOn; }
          renderRecent(); return;
        }
        if (act === 'del') {                 // 删掉勾中的那几条
          cur = readRecent();
          var keep = [], gone = 0;
          for (k = 0; k < cur.length; k++) {
            fk = cur[k].file || '';
            if (recentSel.picked[fk]) gone++; else keep.push(cur[k]);
          }
          writeRecent(keep);
          recentSel.on = false; recentSel.picked = {};
          renderRecent();
          showToast('已删除 ' + gone + ' 条历史记录（各书的阅读进度未删除）', true);
          return;
        }
        if (act === 'clear') {               // 清空全部：两步确认，避免手滑一下全没了
          if (!clearArmed) {
            clearArmed = true;
            this.textContent = '确认清空';
            this.classList.add('confirm');
            if (clearTimer) clearTimeout(clearTimer);
            var self = this;
            clearTimer = setTimeout(function () {
              clearArmed = false;
              self.textContent = '清空';
              self.classList.remove('confirm');
            }, 3000);
            return;
          }
          if (clearTimer) clearTimeout(clearTimer);
          store.del('epubr:recent');
          recentSel.on = false; recentSel.picked = {};
          box.innerHTML = '';
          showToast('已清空最近阅读列表（各书的阅读进度未删除）', true);
        }
      });
    }

    var items = box.querySelectorAll('.recent-item');
    for (var j = 0; j < items.length; j++) {
      items[j].addEventListener('click', async function () {
        var f = this.getAttribute('data-file') || '';
        var nm = this.querySelector('.recent-name');
        var name = nm ? nm.textContent : '';
        if (recentSel.on) {                  // 选择模式下点条目 = 勾选，不去选文件
          recentSel.picked[f] = !recentSel.picked[f];
          renderRecent();
          return;
        }
        // 先试着用上次记住的文件句柄直接打开，找不到（没记住 / 文件被挪走 / file:// 不支持）才弹选择框
        var file = await reopenByHandle(f);
        if (file) {
          try { await openBook(file); return; } catch (e) {}
        }
        showToast('没找到《' + name + '》原来的文件，请手动选一次（选过之后下次就能直接打开）', true);
        chooseBook();
      });
    }
  }

  /* ================= 恢复偏好 ================= */
  (function () {
    var t = store.get('epubr:theme');
    if (t && THEMES[t]) state.theme = t;
    var f = parseInt(store.get('epubr:fontsize'), 10);
    if (f) state.fontSize = f;
    var cw = parseInt(store.get('epubr:colw'), 10);
    if (!isNaN(cw)) state.colWidth = cw;
    markWidth();
    applyTocCollapsed();
    renderRecent();
    restoreNoteDir();
  })();
})();
</script>
</body>
</html>
